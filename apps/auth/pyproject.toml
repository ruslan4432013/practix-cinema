[project]
name = "practix-auth"
version = "1.0.0"
description = "Auth: пользователи, роли, JWT-сессии, OAuth"
requires-python = ">=3.13"
dependencies = [
    "practix-core[asgi,fastapi,otel,jwt,sentry]",
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "async-fastapi-jwt-auth>=0.6.6",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "email-validator>=2.3.0",
    "redis>=8.0.0",
    "httpx>=0.28.1",
    "user-agents>=2.2.0",
    "typer>=0.27.0",
]

[dependency-groups]
test = [
    "practix-testing",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
# Заменяет `python -m practix_auth.cli`. Подкоманда пишется явно
# (`practix-auth createsuperuser --login ...`): команд две, и схлопывание Typer
# снято пустым callback'ом — раньше при единственной команде имя подкоманды не
# принималось вовсе.
practix-auth = "practix_auth.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practix_auth"]
