[pytest]
asyncio_mode = auto
# Область видимости цикла НЕ переопределяется: и фикстуры, и тесты остаются
# function-scoped — ровно по той же причине, что в функциональном наборе рядом.
#
# Набор обязан проходить на голом раннере: ни Postgres, ни Redis, ни
# нотификаций здесь нет и быть не должно. Всё, что он проверяет, — поведение
# кода при недоступности соседей.
#
# И НЕ ДОБАВЛЯЙ [tool.pytest.ini_options] в корневой pyproject.toml: он стал бы
# родительским конфигом сразу для всех наборов репозитория.
