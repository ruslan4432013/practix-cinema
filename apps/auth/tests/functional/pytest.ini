[pytest]
asyncio_mode = auto
# Область видимости цикла НЕ переопределяется: и фикстуры, и тесты остаются
# function-scoped, как было до выравнивания версий pytest-asyncio.
#
# Это не упущение, а требование набора. Фикстуры здесь пересоздают состояние на
# каждый тест (движок SQLAlchemy, клиент Redis, продюсер и консьюмер Kafka), и
# сессионный цикл им не нужен. Более того, сессионная область у фикстур при
# function-scoped тестах ломает набор целиком: соединение, созданное в одном
# цикле, нельзя использовать в другом («got Future attached to a different
# loop»). Сессионный цикл нужен только набору rest — см.
# apps/movies-api/tests/functional/pytest.ini.
#
# НАСЛЕДОВАНИЯ БОЛЬШЕ НЕТ. Раньше этот файл ПЕРЕОПРЕДЕЛЯЛ родительский
# tests/functional/pytest.ini, который включал сессионные области. Теперь наборы
# лежат в разных приложениях, общего родителя нет, и конфиг ниже —
# единственный. Это строго понятнее, но означает: НЕ добавляй
# [tool.pytest.ini_options] в корневой pyproject.toml — он снова стал бы
# родителем и молча вернул бы сессионный цикл, сломав все три набора
# с «got Future attached to a different loop».
