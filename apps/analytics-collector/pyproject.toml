[project]
name = "practix-analytics-collector"
version = "1.0.0"
description = "Analytics Collector: приём пользовательских действий и публикация в Kafka"
requires-python = ">=3.13"
dependencies = [
    "practix-core[asgi,fastapi,otel,kafka,jwt]",
    "practix-contracts",
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "aiokafka>=0.14.0",
    # cramjam нужен aiokafka для lz4/snappy: без него compression_type='lz4'
    # падает в рантайме, а не на старте. Версия закреплена — см. requirements.in
    # в истории: 2.12 меняет ABI и ломает aiokafka 0.14.
    "cramjam==2.11.0",
    "redis>=8.0.0",
    "async-fastapi-jwt-auth>=0.6.6",
    "user-agents==2.2.0",
    "prometheus-client>=0.24.1",
]

[dependency-groups]
test = [
    "practix-testing[kafka,redis,http]",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

[project.scripts]
analytics-collector = "practix_analytics_collector.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practix_analytics_collector"]
