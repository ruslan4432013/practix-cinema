[project]
name = "practix-ugc-api"
version = "1.0.0"
description = "UGC: оценки фильмов, закладки, рецензии"
requires-python = ">=3.13"
dependencies = [
    "practix-core[asgi,fastapi,otel,jwt,sentry]",
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "async-fastapi-jwt-auth>=0.6.6",
    # Нужен только денилисту отозванных токенов: сервис читает Redis Auth-сервиса
    # и своего Redis не имеет.
    "redis>=8.0.0",
    "typer>=0.27.0",
]

[dependency-groups]
test = [
    "practix-testing",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
practix-ugc-api = "practix_ugc_api.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practix_ugc_api"]
