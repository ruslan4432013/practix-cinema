[pytest]
asyncio_mode = auto
# Один event loop на весь прогон — И ДЛЯ ФИКСТУР, И ДЛЯ ТЕСТОВ.
#
# Обе строки обязательны вместе. Набор rest держит сессионные фикстуры
# (es_client, redis_client, http_session в fixtures/), поэтому им нужен
# сессионный цикл; но если оставить тесты в цикле по умолчанию
# (function-scoped), соединение, созданное фикстурой, окажется привязано к
# ЧУЖОМУ циклу, и каждый тест падает с «got Future attached to a different
# loop». Раньше то же самое достигалось переопределением фикстуры
# `event_loop` — приём, удалённый в pytest-asyncio 1.0.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
