[pytest]
asyncio_mode = auto
# Область видимости цикла НЕ переопределяется: и фикстуры, и тесты остаются
# function-scoped.
#
# Это требование набора, а не упущение. Фикстуры пересоздают движок SQLAlchemy и
# клиент Redis на каждый тест, и сессионный цикл им не нужен. Хуже того:
# сессионная область у фикстур при function-scoped тестах ломает набор целиком —
# соединение, созданное в одном цикле, нельзя использовать в другом («got Future
# attached to a different loop»). Сессионный цикл нужен только набору movies-api.
#
# И НЕ ДОБАВЛЯЙ [tool.pytest.ini_options] в корневой pyproject.toml: он стал бы
# родительским конфигом для всех наборов сразу и молча вернул бы сессионный цикл.
