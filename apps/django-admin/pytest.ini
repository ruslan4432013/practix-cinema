; Конфиг набора админки. Отдельный файл, а не секция в pyproject.toml, — по той
; же причине, что и у остальных сервисов репозитория: у каждого набора свои
; настройки, а общий родительский конфиг молча переопределил бы их (см.
; docs/testing.md).
[pytest]
DJANGO_SETTINGS_MODULE = example.settings_test
python_files = tests.py test_*.py
testpaths = movies users
; --no-migrations обязателен, а не «для скорости»: movies/migrations/0001_initial
; начинается с `RunSQL('CREATE SCHEMA IF NOT EXISTS content')`, а схем в SQLite
; нет — миграции упали бы на первой же строке. С этим флагом pytest-django
; строит таблицы прямо из состояния моделей, минуя миграции целиком.
;
; Цена названа честно: сами миграции этим набором НЕ проверяются. Их проверяет
; стенд — контейнер `django-migrations` накатывает их на настоящий Postgres
; перед каждым запуском django-admin.
addopts = -q --no-migrations
