[uwsgi]
socket = :8000
protocol = http

uid = www-data
gid = www-data

master = true
no-orphans = true

die-on-term = true
single-interpreter = true

lazy-apps = true

processes = $(UWSGI_PROCESSES)
threads = $(UWSGI_THREADS)
enable-threads = true

max-requests = 5000

# Построчный лог запросов uwsgi выключен: те же запросы уже лежат в
# JSON-access-логе nginx — вместе с request_id, кодом ответа и таймингами
# апстрима. Своим текстовым форматом uwsgi давал основной объём логов этого
# контейнера и ни одного поля, по которому можно искать. Ошибки при этом
# остаются: log-4xx/log-5xx возвращают строки о неуспешных ответах.
disable-logging = true
log-4xx = true
log-5xx = true

need-app = true
harakiri = $(UWSGI_HARAKIRI)
harakiri-verbose = true

vacuum = true

reload-mercy = 10

chdir = /opt/app

wsgi-file = example/wsgi.py

post-buffering = 1048576
buffer-size = 65535
static-map = /static=/var/wwww/static
static-map = /media=/var/wwww/media



# путь до wsgi-файла, сгенерированного Django

strict = true  # предотвращает запуск сервера, если он неправильно настроен

# принудительно перезагрузить воркер, если он превысит порог по потребляемой памяти
reload-on-rss = 1024

# как долго ждать обработки текущих запросов воркером до принудительной перезагрузки
worker-reload-mercy = 60
