[project]
name = "practix-django-admin"
version = "1.0.0"
description = "Django-админка контента и внутренний content API"
# ВНЕ общего workspace и с ОТДЕЛЬНЫМ uv.lock — сознательно.
#
# uv workspace делит одно разрешение зависимостей и одну планку requires-python.
# Добавление участника на 3.12 опустило бы планку всем пяти сервисам на 3.13 —
# ради единственного сервиса, который от этого ничего не получает: общего
# первопартийного кода у него с ними нет (см. docs/monorepo.md, раздел
# «Что НЕ извлекаем»), а подъём на 3.13 — это отдельная работа с uwsgi, который
# компилируется из исходников против libpcre2.
#
# Nx им по-прежнему управляет: цели в project.json просто указывают на этот
# каталог. Цена — два лок-файла вместо одного, и это дешевле, чем один лок на 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Верхняя граница по мажору стоит СОЗНАТЕЛЬНО. Первый же `uv lock` без неё
    # увёл Django с 5.2.9 на 6.0.7 — мажорный апгрейд на сервисе, набор которого
    # покрывает логику на Python, но не сборку статики и не HTTP-путь входа в
    # админку (см. границу в `conftest.py`). Проверить такой переход всё ещё
    # можно только руками, поэтому он должен быть отдельной осознанной задачей,
    # а не побочным эффектом обновления зависимостей.
    "django>=5.2.9,<6",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "uwsgi>=2.0.30",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-instrumentation-django>=0.64b0",
    "opentelemetry-instrumentation-requests>=0.64b0",
    # Сбор ошибок. Прямая зависимость, а не extra practix-core: библиотеки
    # монорепозитория за границей этого лока недоступны (см. wsgi.py).
    "sentry-sdk>=2.66.1",
]

# Тестовые зависимости — своей группой, а не в основном списке: в образ они не
# нужны, а `uv sync --no-default-groups` в Dockerfile их и не увидит.
#
# Группа заведена ЗДЕСЬ, а не в корневом workspace, по той же причине, по которой
# сервис живёт вне его: свой `uv.lock` и Python 3.12. Версии тут поэтому
# независимы от корневых пинов — второе место, где они закреплены, и это
# сознательная цена границы лока.
[dependency-groups]
test = [
    "pytest>=8.4.2",
    "pytest-django>=4.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Проект — не библиотека: это Django-приложение с manage.py, а не устанавливаемый
# пакет. Собирать колесо не нужно, поэтому сборка нацелена на пустой набор.
[tool.hatch.build.targets.wheel]
packages = ["example"]
