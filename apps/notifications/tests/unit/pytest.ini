[pytest]
# Настройки для тестов — SQLite в памяти. Юнит-набор обязан проходить на голом
# раннере, где нет ни Postgres, ни RabbitMQ, ни SMTP: `nx run-many -t test`
# запускается без контейнеров.
DJANGO_SETTINGS_MODULE = practix_notifications.settings_test
addopts = -q

# И НЕ ДОБАВЛЯЙ [tool.pytest.ini_options] в корневой pyproject.toml: он стал бы
# родительским конфигом сразу для всех наборов репозитория и молча переопределил
# бы область event loop у трёх асинхронных сервисов. Здесь asyncio-режима нет
# вовсе — сервис целиком синхронный.
