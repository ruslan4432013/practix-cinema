[pytest]
# -p no:django ОБЯЗАТЕЛЕН. pytest-django приезжает в образе (он нужен юнит-набору)
# и по умолчанию берёт базу под контроль: заводит отдельную test_*-базу, оборачивает
# каждый тест в транзакцию и запрещает доступ к БД без метки django_db.
#
# Здесь всё это ровно неверно: тест пишет рассылку в ТУ ЖЕ базу, из которой её
# читает воркер в соседнем контейнере. Транзакция теста никогда не будет
# зафиксирована, а значит воркер не увидит ничего, и набор проверял бы пустоту.
# Django нужен нам как обычная библиотека доступа к данным — плагин выключаем.
addopts = -q -p no:django

# asyncio-режим не задан: сервис синхронный целиком (pika BlockingConnection,
# smtplib, Django ORM). И НЕ ДОБАВЛЯЙ [tool.pytest.ini_options] в корневой
# pyproject.toml — он стал бы родительским конфигом для всех наборов сразу.
