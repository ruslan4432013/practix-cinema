[pytest]
# Юнит-набор обязан проходить на голом раннере: ни RabbitMQ, ни Redis, ни
# запущенного шлюза. Всё внешнее заменено заглушками, поэтому `nx run-many -t test`
# работает без контейнеров.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q

# И НЕ ДОБАВЛЯЙ [tool.pytest.ini_options] в корневой pyproject.toml: он стал бы
# родительским конфигом сразу для всех наборов репозитория и молча переопределил
# бы область event loop у трёх асинхронных сервисов. Здесь она function-scoped:
# каждый тест поднимает свои очереди и задачи, и общий цикл склеил бы их.
