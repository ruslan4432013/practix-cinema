name: CI

# Тесты и линтер на каждый pull request и на пуш в main: до этого падение
# набора обнаруживалось в лучшем случае на код-ревью.
on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: интеграционные наборы
# поднимают Kafka и ClickHouse, и держать несколько таких прогонов бессмысленно.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтер и форматтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.14.2
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  unit:
    name: Юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Установить зависимости коллектора
        run: |
          python -m pip install --upgrade pip
          pip install -r analytics_collector/requirements.txt
      - name: pytest tests/unit
        env:
          PYTHONPATH: analytics_collector/src
          UGC_ENV: test
        run: pytest tests/unit -v

  # Наборы независимы и идут параллельно. Каждый поднимает только свои
  # зависимости, поэтому `ugc` не мешает `rest` и наоборот. Матрица, а не один
  # job: падение одного набора не должно скрывать состояние остальных.
  functional:
    name: Функциональные тесты (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        suite: [rest, auth, ugc, etl]
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить .env
        run: cp .env.example .env

      # `up --abort-on-container-exit` здесь не годится: он валит весь стек,
      # как только завершается одноразовый init-контейнер (kafka-init,
      # clickhouse-init). Отсюда `run --rm` на конкретный сервис.
      - name: Прогнать набор
        run: |
          set -o pipefail
          case "${{ matrix.suite }}" in
            rest) service=tests ;;
            auth) service=auth-tests ;;
            ugc)  service=ugc-tests ;;
            etl)  service=etl-tests ;;
          esac
          docker compose -f tests/functional/docker-compose.yml \
                         --project-directory tests/functional \
                         run --rm --build "$service"

      - name: Логи стека при падении
        if: failure()
        run: |
          docker compose -f tests/functional/docker-compose.yml \
                         --project-directory tests/functional logs --tail=200

      - name: Погасить стек
        if: always()
        run: |
          docker compose -f tests/functional/docker-compose.yml \
                         --project-directory tests/functional down -v
