name: CI

# Тесты и линтер на каждый pull request и на пуш в main.
on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: интеграционные наборы
# поднимают Kafka и ClickHouse, и держать несколько таких прогонов бессмысленно.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.11.16'
  NODE_VERSION: '24'

jobs:
  # --------------------------------------------------------------------------
  # Быстрые проверки: линтер, типы, юнит-тесты — только для затронутых проектов.
  #
  # Job матричная по версии Python. В матрице ВЕРХНЯЯ и НИЖНЯЯ поддерживаемые
  # версии — 3.13 (планка `requires-python` всех 11 пакетов workspace) и 3.14
  # (текущая стабильная). Смысл именно в паре: 3.13 стережёт нижнюю границу,
  # чтобы в код не просочился синтаксис новее заявленного минимума, а 3.14 ловит
  # поломки от свежего интерпретатора и его колёс — то есть ту самую версию, на
  # которую однажды придётся переезжать.
  #
  # НИЖЕ 3.13 матрица не расширяется, и это не лень:
  #
  #   * все 11 пакетов объявляют `requires-python = ">=3.13"`, а uv workspace
  #     делит ОДНО разрешение зависимостей и одну планку — понизить её можно
  #     только всем сразу, пересобрав uv.lock;
  #   * код использует generics из PEP 695 (`class BaseService[ModelType]` в
  #     apps/movies-api/src/practix_movies_api/services/base.py,
  #     `class ModelCache[ModelType]` рядом) — на 3.10 и 3.11 это СИНТАКСИЧЕСКАЯ
  #     ошибка, то есть прогон падал бы на импорте, а не на тесте.
  #
  # Чтобы добавить версию НИЖЕ 3.12, нужно в одном коммите: понизить
  # requires-python во всех pyproject.toml (кроме django-admin — он вне
  # workspace и пришпилен к 3.12), переписать generics PEP 695 на TypeVar +
  # Generic, опустить target-version у ruff и python_version у mypy, пересобрать
  # uv.lock. Добавление строки в матрицу без этого даёт красный CI, а не
  # проверку совместимости.
  #
  # UV_PYTHON заставляет ВСЕ шаги (ruff, mypy, pytest — они запускаются через
  # `uv run` из целей Nx) использовать интерпретатор ветви матрицы, а не тот,
  # что оказался на раннере. Чтобы это было правдой, из целей `test` библиотек
  # снят ключ `--python 3.13`: он старше по приоритету, чем UV_PYTHON, и все три
  # библиотечных набора гонялись на 3.13 в обеих ветвях матрицы — вторая ветвь
  # молча проверяла ровно то же самое.
  # --------------------------------------------------------------------------
  checks:
    name: Проверки (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Ветви независимы: падение на одной версии не должно скрывать результат
      # на остальных — иначе непонятно, проблема в коде или в версии.
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна nx-set-shas: без неё не с чем сравнивать базу.
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # ГЕЙТ ЦЕЛОСТНОСТИ ГРАФА — обязан идти ДО nx affected.
      #
      # Рёбра lib -> app плагин @nxlv/python берёт из uv.lock (поле
      # metadata.requires-dist.<dep>.editable). Устаревший лок УДАЛЯЕТ рёбра
      # молча: граф остаётся валидным, affected продолжает работать и просто
      # перестаёт выбирать приложения при правке библиотеки. Изменение общего
      # кода уехало бы непротестированным — единственный сценарий, в котором
      # монорепозиторий хуже того, что было до него.
      - name: uv lock --check
        run: uv lock --check

      - name: Синхронизировать окружение
        run: uv sync --locked --all-packages --all-extras

      # Список COPY <member>/pyproject.toml в Dockerfile нельзя записать
      # шаблоном (COPY со звёздочкой уплощает дерево), поэтому он ручной — и
      # проверяется на соответствие членам workspace.
      - name: Манифесты в Dockerfile соответствуют workspace
        run: uv run python tools/check_docker_manifests.py

      - name: Граф зависимостей соответствует ожидаемому
        run: |
          npx nx graph --file=graph.json
          uv run python tools/check_graph_edges.py graph.json

      # Кеш задач Nx. Ключ включает локи: смена зависимостей обязана
      # инвалидировать всё, иначе кеш отдаст зелёный результат для другого набора.
      # Версия Python — часть ключа по той же причине: входы задач у ветвей
      # матрицы совпадают побайтово, и без неё ветвь 3.12 получила бы зелёный
      # результат, посчитанный на 3.13, то есть матрица ничего бы не проверяла.
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-py${{ matrix.python-version }}-${{ hashFiles('package-lock.json', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-py${{ matrix.python-version }}-${{ hashFiles('package-lock.json', 'uv.lock') }}-

      - name: nx affected — lint (ruff check + ruff format --check)
        run: npx nx affected -t lint --parallel=3

      # ПРОВЕРКА ТИПОВ идёт двумя шагами, и это не дублирование.
      #
      # `mypy` по корневому конфигу гоняется ВСЕГДА и на всё дерево, потому что
      # ровно этот гейт уже был здесь однажды мёртвым: конфиг существовал, но не
      # запускался ни в CI, ни в pre-commit, и под ним тихо накопилось 10 ошибок.
      # `nx affected -t typecheck` такой гарантии не даёт — при правке, не
      # затронувшей библиотеки, он не выбирает ничего и проходит пустым.
      # Прогон дешёвый: конфиг покрывает libs/ (31 файл), секунды.
      - name: Проверка типов (mypy, корневой конфиг)
        run: uv run mypy --python-version ${{ matrix.python-version }}
      - name: nx affected — typecheck (по проектам, с кешем)
        run: npx nx affected -t typecheck --parallel=3

      - name: nx affected — test (юнит-тесты и тесты библиотек)
        run: npx nx affected -t test --parallel=3

  # --------------------------------------------------------------------------
  # Список функциональных наборов для матрицы ниже.
  #
  # Отдельной job, а НЕ шагом в checks: у матричной job вывод пишут все ветви,
  # и значение достаётся от той, что финишировала последней. В матрице две
  # версии, так что это была бы настоящая гонка — проявляется она как случайно
  # пропущенные функциональные наборы.
  # --------------------------------------------------------------------------
  affected-suites:
    name: Затронутые функциональные наборы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # uv нужен плагину @nxlv/python: рёбра графа он читает из uv.lock.
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Список затронутых наборов
        id: affected
        run: |
          suites=$(npx nx show projects --affected --with-target test-functional --json)
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "Затронутые наборы: $suites"
    outputs:
      suites: ${{ steps.affected.outputs.suites }}

  # --------------------------------------------------------------------------
  # Детектор дублирования: гейт против регресса. Порог в .jscpd.json чуть выше
  # достигнутого уровня и снижается по мере извлечения — см. docs/monorepo.md.
  # --------------------------------------------------------------------------
  duplication:
    name: Дублирование кода (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx jscpd --config .jscpd.json .
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: .jscpd/
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Функциональные наборы. Матрица генерируется из affected: PR, не трогающий
  # аналитику, больше не поднимает Kafka и ClickHouse.
  #
  # Матрица остаётся ПАРАЛЛЕЛЬНОЙ. Правило «один набор за раз с down -v»
  # действует внутри ОДНОГО демона Docker (наборы ETL публикуют заведомо
  # некорректные сообщения, которые ломают фикстуру декодирования коллектора), а
  # у каждого раннера GitHub свой демон.
  #
  # Версия Python здесь не матрицуется: наборы гоняются В ОБРАЗЕ, а интерпретатор
  # образа задан в infra/docker/python-service.Dockerfile.
  # --------------------------------------------------------------------------
  functional:
    name: Функциональные тесты (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [checks, affected-suites]
    if: needs.affected-suites.outputs.suites != '' && needs.affected-suites.outputs.suites != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.affected-suites.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Подготовить .env
        run: cp .env.example .env

      # Кеш слоёв BuildKit. Это САМЫЙ КРУПНЫЙ выигрыш во всём CI: раньше каждая
      # из четырёх ветвей матрицы собирала образ с нуля (`run --rm --build`), то
      # есть заново ставила все зависимости, четыре раза на каждый PR.
      - uses: docker/setup-buildx-action@v3

      - name: Собрать образ и прогнать набор
        run: npx nx run ${{ matrix.project }}:test-functional

      - name: Логи стека при падении
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.test.yml \
                         --project-directory infra/compose logs --tail=200

      - name: Погасить стек
        if: always()
        run: |
          docker compose -f infra/compose/docker-compose.test.yml \
                         --project-directory infra/compose down -v

  # --------------------------------------------------------------------------
  # Уведомление в Telegram об итоге прогона.
  #
  # Вся логика — в tools/notify_telegram.py: агрегация результатов job и
  # экранирование текста, пришедшего извне, это код, а код должен запускаться
  # локально (`--dry-run`) и проверяться, а не жить строкой внутри YAML. Шаг
  # здесь только передаёт данные события переменными окружения — подстановка
  # ${{ }} с заголовком коммита прямо в тело `run` означала бы выполнение чужой
  # строки шеллом раннера.
  #
  # Секреты репозитория (Settings -> Secrets and variables -> Actions):
  #   TELEGRAM_BOT_TOKEN — токен бота от @BotFather
  #   TELEGRAM_CHAT_ID   — id чата или канала (для канала — с минусом: -100...)
  # В PR из форка секреты недоступны по построению — скрипт в этом случае пишет
  # ::notice:: и выходит с нулём, а не красит прогон.
  # --------------------------------------------------------------------------
  notify:
    name: Уведомление в Telegram
    runs-on: ubuntu-latest
    needs: [checks, affected-suites, duplication, functional]
    # Нужен итог ЛЮБОГО прогона, включая красный; отменённые (concurrency выше
    # гасит предыдущий прогон при новом пуше) не уведомляем — это не результат.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # --no-project --with aiohttp, а НЕ `uv sync` всего workspace: скрипту
      # нужен ровно один пакет, а синхронизация 109 зависимостей ради одного
      # HTTP-запроса добавляла бы минуту к каждому прогону.
      - name: Отправить сообщение
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # toJSON(needs) — результаты ВСЕХ job разом: добавленная в workflow job
          # попадёт в сообщение сама, без правки списка переменных здесь.
          CI_NEEDS: ${{ toJSON(needs) }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --no-project --with aiohttp python tools/notify_telegram.py
