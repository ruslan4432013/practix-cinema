[project]
name = "practix-contracts"
version = "1.0.0"
description = "Контракт событий аналитики: словарь типов, топики, ключ партиционирования"
requires-python = ">=3.13"
# Зависимостей нет и быть не должно: контракт обязан импортироваться и продюсером
# (FastAPI + pydantic), и консьюмером (asyncio + clickhouse-connect), не втягивая
# в них ничего лишнего. Только stdlib.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practix_contracts"]
