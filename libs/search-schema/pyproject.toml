[project]
name = "practix-search-schema"
version = "1.0.0"
description = "Схемы индексов Elasticsearch (movies, genres, persons) — общие для ETL и тестов"
requires-python = ">=3.13"
# Только stdlib: это данные, а не код, работающий с Elasticsearch.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practix_search_schema"]
