[project]
name = "practix-core"
version = "0.1.0"
description = "Сквозные механизмы, общие для сервисов: логирование, request-id, трассировка, backoff, пагинация"
requires-python = ">=3.13"
# Базовая часть библиотеки не тянет ни FastAPI, ни OpenTelemetry: её импортирует
# и etl-elasticsearch, у которого нет ни HTTP-слоя, ни трассировки. Всё
# остальное — в extras ниже, чтобы образ ETL не получал fastapi транзитивно.
dependencies = []

[project.optional-dependencies]
# Middleware (request-id, rate limit) — только для ASGI-сервисов.
# opentelemetry-api, а не -sdk: middleware лишь ставит тег на активный span и
# работает как no-op, когда провайдер не сконфигурирован.
asgi = [
    "starlette>=0.42.0",
    "opentelemetry-api>=1.43.0",
]
# Инструментация FastAPI-приложения.
fastapi = [
    "fastapi>=0.137.1",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
]
otel = [
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
]
httpx = ["opentelemetry-instrumentation-httpx>=0.64b0"]
kafka = ["opentelemetry-instrumentation-aiokafka>=0.64b0"]
# Сбор ошибок. НЕ sentry-sdk[fastapi]: тот extra тянет лишь сам fastapi, который
# у FastAPI-сервисов и так есть, а в образ etl-clickhouse (practix-core[otel,kafka],
# намеренно без fastapi) его протащить нельзя. Интеграции FastAPI/Django SDK
# включает сам по факту импортируемости фреймворка.
sentry = ["sentry-sdk>=2.66.1"]
# Обвязка JWT: нужна трём FastAPI-приложениям, но не ETL.
jwt = [
    "async-fastapi-jwt-auth>=0.6.6",
    "fastapi>=0.137.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practix_core"]
