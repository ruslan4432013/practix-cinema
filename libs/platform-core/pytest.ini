[pytest]
# asyncio_mode = auto: async-тесты не нуждаются в декораторе.
#
# Область event loop НЕ переопределяется (остаётся функциональной). Это
# сознательно и совпадает с тем, что делают tests/functional/{auth,etl,ugc}:
# session-scoped loop ломает фикстуры, пересоздающие клиенты на каждый тест
# («got Future attached to a different loop»). Здесь таких фикстур нет, но
# и причин отходить от функциональной области — тоже.
asyncio_mode = auto
