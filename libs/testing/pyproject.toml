[project]
name = "practix-testing"
version = "0.1.0"
description = "Общие фикстуры, настройки и скрипты ожидания сервисов для функциональных наборов"
requires-python = ">=3.13"
dependencies = [
    "practix-core",
    "practix-search-schema",
    "pydantic-settings>=2.14.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
# Клиенты нужны только тем наборам, которые их ждут: скрипт ожидания Kafka не
# должен тянуть Elasticsearch в образ ETL и наоборот.
elasticsearch = ["elasticsearch[async]>=9.4.0"]
redis = ["redis>=8.0.0"]
kafka = ["aiokafka>=0.14.0"]
clickhouse = ["clickhouse-connect[async]==1.6.0"]
http = ["aiohttp>=3.14.3", "httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practix_testing"]
