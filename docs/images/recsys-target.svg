<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 880" width="1340" height="880" role="img">
  <title>Целевая архитектура рекомендаций: офлайн-тренер читает ClickHouse, ugc-db и каталог, раскладывает топ-N в recs-db и прогревает redis-recs; онлайн recommendations-api читает сначала кэш, затем базу, а при отсутствии модели отдаёт топ популярных.</title>
  <style>
  .bgr { fill: #F6F9F8; }
  text { font-kerning: normal; }
  .box { fill: #FFFFFF; stroke: #C4CECB; stroke-width: 1.5; }
  .box-dim { fill: none; stroke: #C4CECB; stroke-width: 1.5; }
  .bar { fill: #DFE5E3; stroke: #C4CECB; stroke-width: 1.5; }
  .new { fill: #F6E9D2; stroke: #A9660A; stroke-width: 2; }
  .new-o { fill: none; stroke: #A9660A; stroke-width: 1.75; stroke-dasharray: 7 4; }
  .danger { fill: #F6E1E1; stroke: #9C3838; stroke-width: 1.75; stroke-dasharray: 7 4; }
  .h { fill: #121A18; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
  .h-acc { fill: #7E4C06; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; }
  .h-warn { fill: #9C3838; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 600; }
  .sub { fill: #37423F; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; }
  .t { fill: #66736F; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; }
  .t-acc { fill: #7E4C06; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; }
  .band-label { fill: #66736F; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.13em; }
  .badge-r { fill: #A9660A; }
  .badge-t { fill: #FFFFFF; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 700; }
  .rule { stroke: #C4CECB; stroke-width: 1; }
  .div { stroke: #DCE3E1; stroke-width: 1; }
  .arrow { stroke: #66736F; stroke-width: 1.5; fill: none; }
  .arrow-dash { stroke: #66736F; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
  .arrow-acc { stroke: #A9660A; stroke-width: 2; fill: none; }
  .arrow-warn { stroke: #9C3838; stroke-width: 1.75; fill: none; stroke-dasharray: 6 4; }
  .hd-m { fill: #66736F; }
  .hd-a { fill: #A9660A; }
  .hd-w { fill: #9C3838; }
  </style>
  <rect class="bgr" x="0" y="0" width="1340" height="880"/>

          <defs>
            <marker id="t-hd" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
              <polygon points="0,0 10,4 0,8" class="hd-m"></polygon>
            </marker>
            <marker id="t-hd-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
              <polygon points="0,0 10,4 0,8" class="hd-a"></polygon>
            </marker>
            <marker id="t-hd-w" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
              <polygon points="0,0 10,4 0,8" class="hd-w"></polygon>
            </marker>
          </defs>

          <!-- ================= полоса 1: офлайн ================= -->
          <text x="40" y="50" class="band-label">ОФЛАЙН — БАТЧ ПО РАСПИСАНИЮ, НИЧЕГО НЕ ЗАВИСИТ ОТ ЗАПРОСА</text>
          <line x1="560" y1="46" x2="1300" y2="46" class="rule"></line>

          <!-- источники -->
          <rect x="40" y="80" width="280" height="62" rx="8" class="box-dim"></rect>
          <text x="58" y="102" class="sub">ClickHouse · ugc.film_views</text>
          <text x="58" y="118" class="t">video_progress, video_completed</text>
          <text x="58" y="134" class="t">неявный сигнал — основной</text>

          <rect x="40" y="154" width="280" height="62" rx="8" class="box-dim"></rect>
          <text x="58" y="176" class="sub">ugc-db</text>
          <text x="58" y="192" class="t">оценки 0..10, закладки</text>
          <text x="58" y="208" class="t">явный сигнал, объёмом меньше</text>

          <rect x="40" y="228" width="280" height="62" rx="8" class="box-dim"></rect>
          <text x="58" y="250" class="sub">theatre-db · elasticsearch</text>
          <text x="58" y="266" class="t">жанры, персоны, описания</text>
          <text x="58" y="282" class="t">контентные признаки</text>

          <polyline points="320,111 360,111 360,195 392,195" class="arrow-acc" marker-end="url(#t-hd-a)"></polyline>
          <polyline points="320,185 360,185 360,195 392,195" class="arrow-acc" marker-end="url(#t-hd-a)"></polyline>
          <polyline points="320,259 360,259 360,195 392,195" class="arrow-acc" marker-end="url(#t-hd-a)"></polyline>
          <text x="180" y="316" class="t">читаем как есть — схему источников не трогаем</text>

          <!-- тренер -->
          <rect x="400" y="120" width="340" height="150" rx="8" class="new"></rect>
          <rect x="694" y="132" width="34" height="17" rx="4" class="badge-r"></rect>
          <text x="711" y="144.5" class="badge-t" text-anchor="middle">E3</text>
          <text x="420" y="150" class="h-acc">recsys-trainer</text>
          <line x1="420" y1="162" x2="720" y2="162" class="div"></line>
          <text x="420" y="182" class="t-acc">новый сервис в монорепозитории (apps/)</text>
          <text x="420" y="200" class="t-acc">матрица user × film, сплит по времени — E2</text>
          <text x="420" y="218" class="t-acc">со-встречаемость → «похожие фильмы» — E3</text>
          <text x="420" y="236" class="t-acc">ALS → персональные топ-N — E6, режется</text>
          <text x="420" y="256" class="t-acc">перезапуск идемпотентен, записи не двоятся</text>

          <line x1="740" y1="195" x2="852" y2="195" class="arrow-acc" marker-end="url(#t-hd-a)"></line>
          <text x="796" y="186" class="t" text-anchor="middle">модель и прогноз</text>

          <!-- метрики -->
          <rect x="860" y="120" width="440" height="150" rx="8" class="new-o"></rect>
          <rect x="1254" y="132" width="34" height="17" rx="4" class="badge-r"></rect>
          <text x="1271" y="144.5" class="badge-t" text-anchor="middle">E5</text>
          <text x="880" y="150" class="h-acc">оценка качества</text>
          <line x1="880" y1="162" x2="1280" y2="162" class="div"></line>
          <text x="880" y="182" class="t-acc">precision@k, recall@k, покрытие каталога</text>
          <text x="880" y="200" class="t-acc">на отложенной выборке, сплит по времени</text>
          <text x="880" y="218" class="t-acc">baseline — «просто популярное»</text>
          <text x="880" y="236" class="t-acc">воспроизводится одной командой</text>
          <text x="880" y="256" class="t">без этого «откуда вы знаете, что хорошо» нечем закрыть</text>

          <!-- тренер -> витрина -->
          <line x1="570" y1="270" x2="570" y2="358" class="arrow-acc" marker-end="url(#t-hd-a)"></line>
          <text x="582" y="322" class="t">раскладывает топ-N, идемпотентно</text>

          <!-- ================= полоса 2: витрина ================= -->
          <text x="40" y="344" class="band-label">ВИТРИНА ГОТОВЫХ ТОП-N — ГРАНИЦА ОФЛАЙНА И ОНЛАЙНА</text>
          <line x1="460" y1="340" x2="552" y2="340" class="rule"></line>
          <line x1="588" y1="340" x2="1300" y2="340" class="rule"></line>

          <rect x="400" y="366" width="340" height="136" rx="8" class="new"></rect>
          <rect x="694" y="378" width="34" height="17" rx="4" class="badge-r"></rect>
          <text x="711" y="390.5" class="badge-t" text-anchor="middle">E3</text>
          <text x="420" y="396" class="h-acc">recs-db · PostgreSQL</text>
          <line x1="420" y1="408" x2="720" y2="408" class="div"></line>
          <text x="420" y="428" class="t-acc">similar(film_id, items, built_at)</text>
          <text x="420" y="446" class="t-acc">personal(user_id, items, built_at)</text>
          <text x="420" y="464" class="t-acc">popular(period, items, built_at)</text>
          <text x="420" y="486" class="t">источник истины · свой инстанс, как у ugc</text>

          <line x1="740" y1="434" x2="792" y2="434" class="arrow-acc" marker-end="url(#t-hd-a)"></line>
          <text x="766" y="424" class="t" text-anchor="middle">прогрев</text>

          <rect x="800" y="366" width="300" height="136" rx="8" class="new"></rect>
          <text x="820" y="396" class="h-acc">redis-recs</text>
          <line x1="820" y1="408" x2="1080" y2="408" class="div"></line>
          <text x="820" y="428" class="t-acc">горячий слой перед выдачей</text>
          <text x="820" y="446" class="t-acc">в ключе — версия витрины,</text>
          <text x="820" y="464" class="t-acc">переключение атомарное</text>
          <text x="820" y="486" class="t">промах — не ошибка, а шаг ②</text>

          <text x="1140" y="400" class="t">одна точка записи —</text>
          <text x="1140" y="418" class="t">только тренер.</text>
          <text x="1140" y="436" class="t">онлайн не пишет</text>
          <text x="1140" y="454" class="t">в витрину ничего.</text>

          <!-- ================= полоса 3: онлайн ================= -->
          <text x="40" y="548" class="band-label">ОНЛАЙН — ТОЛЬКО ЧТЕНИЕ, p95 &lt; 200 МС ПРИ ТРЕБОВАНИИ ≤ 300 МС</text>
          <line x1="524" y1="544" x2="590" y2="544" class="rule"></line>
          <line x1="612" y1="544" x2="890" y2="544" class="rule"></line>
          <line x1="912" y1="544" x2="1300" y2="544" class="rule"></line>

          <!-- чтение вверх -->
          <line x1="600" y1="580" x2="600" y2="508" class="arrow-acc" marker-end="url(#t-hd-a)"></line>
          <text x="610" y="528" class="t">② промах кэша</text>
          <polyline points="790,580 790,562 900,562 900,508" class="arrow-acc" marker-end="url(#t-hd-a)"></polyline>
          <text x="912" y="528" class="t">① попадание</text>

          <rect x="40" y="580" width="200" height="70" rx="8" class="box-dim"></rect>
          <text x="58" y="606" class="sub">клиент</text>
          <text x="58" y="624" class="t">«Рекомендуем вам»</text>
          <text x="58" y="640" class="t">на главной</text>
          <line x1="240" y1="615" x2="282" y2="615" class="arrow" marker-end="url(#t-hd)"></line>

          <rect x="290" y="580" width="160" height="70" rx="8" class="box-dim"></rect>
          <rect x="404" y="590" width="34" height="17" rx="4" class="badge-r"></rect>
          <text x="421" y="602.5" class="badge-t" text-anchor="middle">E7</text>
          <text x="308" y="606" class="sub">nginx</text>
          <text x="308" y="626" class="t">^~ /api/v1/</text>
          <text x="308" y="642" class="t">recommendations</text>
          <line x1="450" y1="615" x2="492" y2="615" class="arrow" marker-end="url(#t-hd)"></line>

          <rect x="40" y="670" width="200" height="70" rx="8" class="box-dim"></rect>
          <rect x="194" y="680" width="34" height="17" rx="4" class="badge-r"></rect>
          <text x="211" y="692.5" class="badge-t" text-anchor="middle">E7</text>
          <text x="58" y="696" class="sub">movies-api</text>
          <text x="58" y="716" class="t">страница фильма →</text>
          <text x="58" y="732" class="t">блок «Похожие»</text>
          <line x1="240" y1="705" x2="492" y2="705" class="arrow-dash" marker-end="url(#t-hd)"></line>
          <text x="366" y="696" class="t" text-anchor="middle">внутренний вызов</text>

          <!-- API -->
          <rect x="500" y="580" width="340" height="200" rx="8" class="new"></rect>
          <rect x="794" y="592" width="34" height="17" rx="4" class="badge-r"></rect>
          <text x="811" y="604.5" class="badge-t" text-anchor="middle">E4</text>
          <text x="520" y="610" class="h-acc">recommendations-api</text>
          <line x1="520" y1="622" x2="820" y2="622" class="div"></line>
          <text x="520" y="642" class="t-acc">FastAPI · только читает готовое</text>
          <text x="520" y="660" class="t-acc">в запросе не считается ничего</text>
          <text x="520" y="678" class="t-acc">user_id — из JWT, проверка локальная</text>
          <line x1="520" y1="694" x2="820" y2="694" class="div"></line>
          <text x="520" y="714" class="t-acc">① redis-recs — попадание</text>
          <text x="520" y="732" class="t-acc">② recs-db — промах кэша</text>
          <text x="520" y="750" class="t-acc">③ популярное — модели нет</text>
          <text x="520" y="770" class="t">GET /similar/{film_id} · GET /for-me</text>

          <line x1="840" y1="668" x2="892" y2="668" class="arrow-warn" marker-end="url(#t-hd-w)"></line>
          <text x="866" y="658" class="t" text-anchor="middle">③</text>

          <!-- деградация -->
          <rect x="900" y="618" width="400" height="100" rx="8" class="danger"></rect>
          <text x="920" y="644" class="h-warn">деградация — путь по умолчанию</text>
          <line x1="920" y1="654" x2="1280" y2="654" class="div"></line>
          <text x="920" y="674" class="t">пустой кэш или несостоявшееся обучение отдают</text>
          <text x="920" y="692" class="t">топ популярных за период — ответ 200, а не 5xx</text>
          <text x="920" y="710" class="t">тот же recs-db, таблица popular — не второй сервис</text>

          <!-- Auth -->
          <rect x="40" y="760" width="200" height="64" rx="8" class="box-dim"></rect>
          <text x="58" y="786" class="sub">Auth</text>
          <text x="58" y="806" class="t">токен, роли, user_id</text>
          <polyline points="240,792 560,792 560,788" class="arrow-dash" marker-end="url(#t-hd)"></polyline>
          <text x="580" y="800" class="t">JWT проверяется локально — персональные данные не покидают Auth</text>
        
</svg>
