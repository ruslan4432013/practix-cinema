# Общее окружение контейнеров сервиса нотификаций (образ один, ролей пять).
# Якорь на верхнем уровне, а не внутри services: расширяющие поля `x-*` рядом с
# именами сервисов Compose разбирает по-разному в зависимости от версии, и
# отладка этого стоит дороже пяти строк.
x-notifications-env: &notifications-test-env
  PYTEST_ADDOPTS: -p no:cacheprovider
  NOTIFY_POSTGRES_HOST: notifications-db
  NOTIFY_POSTGRES_PORT: "5432"
  NOTIFY_POSTGRES_USER: postgres
  NOTIFY_POSTGRES_PASSWORD: secret
  NOTIFY_POSTGRES_DB: notifications_database
  NOTIFY_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
  NOTIFY_SMTP_HOST: mailpit
  NOTIFY_SMTP_PORT: "1025"
  # Тик раз в секунду вместо тридцати: тест на отложенную рассылку иначе ждал бы
  # полминуты на ровном месте.
  NOTIFY_SCHEDULER_TICK_SECONDS: "1"
  NOTIFY_RETRY_TTL_MS: "2000"
  NOTIFY_MAX_ATTEMPTS: "2"
  # Тихие часы ВКЛЮЧЕНЫ, и окно накрывает сутки целиком — то есть срабатывают
  # они всегда и не зависят от времени запуска набора. Раньше здесь стояло
  # `False`, потому что окно по умолчанию (22:00–09:00) роняло бы ночной прогон;
  # но выключенные тихие часы означали, что на стенде они не проверялись вовсе.
  #
  # Что делает набор детерминированным при включённом окне: вторая, ПОКАМПАНЕЙНАЯ
  # проверка `Campaign.respect_quiet_hours`. Фикстура `campaign` в conftest
  # ставит её в False, поэтому все остальные тесты отправляют письма как прежде,
  # а тест тихих часов заводит свою рассылку с флагом True.
  NOTIFY_QUIET_HOURS_ENABLED: "True"
  NOTIFY_QUIET_HOURS_START: "00:00"
  NOTIFY_QUIET_HOURS_END: "23:59"
  NOTIFY_SMTP_RATE_PER_SECOND: "200"
  # Межсервисный секрет приёма событий: набор шлёт доменные события сам, вместо
  # контентной админки.
  NOTIFY_INTAKE_TOKEN: test-internal-token
  # Личный кабинет. Токен набор подписывает сам этим же ключом — в том и смысл
  # локальной проверки, что ходить в Auth за ней не нужно. Отзыв читается в
  # Redis ядра, куда тест пишет jti напрямую.
  AUTHJWT_SECRET_KEY: secret
  AUTH_REDIS_HOST: redis
  AUTH_REDIS_PORT: "6379"
  AUTH_REDIS_DB: "0"
  # Настоящий Auth: формирующий воркер ходит туда за именем, фамилией и адресом
  # получателя, и подменять это заглушкой значило бы не проверять главное.
  # Учётка заводится одноразовым контейнером auth-service-account.
  NOTIFY_AUTH_API_URL: http://auth:8000
  NOTIFY_AUTH_SERVICE_LOGIN: svc-notifications
  NOTIFY_AUTH_SERVICE_PASSWORD: Svc-Notify123!
  NOTIFY_BUILD_MESSAGE_BATCH: "5"
  NOTIFY_BUILDER_LOOKUP_BATCH: "50"
  NOTIFY_RETRY_BUILD_TTL_MS: "2000"
  NOTIFY_BUILD_MAX_ATTEMPTS: "2"
  # Кеш резолва выключен: тест меняет имя в Auth и ждёт его в следующем письме.
  NOTIFY_DIRECTORY_CACHE_TTL: "0"
  # Настоящий сервис сокращения ссылок: сквозной тест подтверждения адреса
  # разбирает ссылку прямо из письма и ходит по ней.
  NOTIFY_SHORTENER_API_URL: http://link-shortener:8000
  NOTIFY_SHORTENER_INTERNAL_TOKEN: test-shortener-token
  NOTIFY_CONFIRM_REDIRECT_URL: http://localhost/
  OTEL_ENABLED: "False"
  SENTRY_ENABLED: "False"

# Сборка образа Auth. Объявлена у ВСЕХ трёх сервисов, а не у одного: compose
# собирает образ только для той службы, у которой есть секция build, а для
# остальных пытается его СКАЧАТЬ — и падает на `pull access denied`, потому что
# practix/auth в реестре не существует. С общим якорем любой порядок разрешения
# зависимостей приводит к собранному образу.
# Сборка образа сервиса ссылок. Объявлена якорем и повешена на ВСЕ три службы,
# которые делят тег, — по той же причине, что и у Auth ниже: compose собирает
# образ только там, где есть секция build, а остальные пытается СКАЧАТЬ и падает
# на `pull access denied`.
x-shortener-build: &shortener-test-build
  context: ../..
  dockerfile: infra/docker/python-service.Dockerfile
  target: link-shortener
  args:
    PACKAGE: practix-link-shortener
    UV_GROUPS: --group test

x-auth-build: &auth-test-build
  context: ../..
  dockerfile: infra/docker/python-service.Dockerfile
  target: auth
  args:
    PACKAGE: practix-auth

# Общее окружение контейнеров Auth в стенде нотификаций (образ один, ролей три:
# миграции, сервис, заведение служебной учётки).
x-auth-env: &auth-test-env
  AUTH_POSTGRES_HOST: auth-db
  AUTH_POSTGRES_PORT: "5432"
  AUTH_POSTGRES_USER: postgres
  AUTH_POSTGRES_PASSWORD: secret
  AUTH_POSTGRES_DB: auth_database
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  AUTHJWT_SECRET_KEY: secret
  # 20 запросов в минуту на IP — лимит, рассчитанный на человека. Формирующий
  # воркер делает запрос на пачку получателей, и за прогон их десятки; с боевым
  # лимитом набор падал бы на 429, проверяя не то, что задумано.
  RATE_LIMIT_TIMES: "10000"
  OTEL_ENABLED: "False"
  SENTRY_ENABLED: "False"

services:
  elasticsearch:
    image: elasticsearch:9.4.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis наборов rest и auth: кэш Movies API, денилист и сессии Auth.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Отдельный экземпляр под набор ugc — как в боевом compose (redis-ugc).
  # Раньше наборы делили один контейнер, разведённые лишь номером базы
  # (UGC_REDIS_DB=1 против 0). Это работало, но держалось на том, что никто не
  # напишет `flushall` вместо `flushdb`: при параллельном прогоне в CI такая
  # правка выглядела бы как случайное падение чужого набора.
  redis-ugc:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fastapi:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: movies-api
      args:
        PACKAGE: practix-movies-api
        UV_GROUPS: --group test
    image: practix/movies-api:test
    environment:
      - ELASTIC_HOST=elasticsearch
      - ELASTIC_PORT=9200
      - ELASTIC_SCHEMA=http://
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Трассировка выключена: Jaeger в тестовом стеке нет, а экспортёр иначе
      # засоряет вывод повторами неудачных отправок спанов.
      - OTEL_ENABLED=False
      # Сбор ошибок выключен по той же причине: приёмника в тестовом
      # стеке нет. Код-дефолт и так False, но явное лучше подразумеваемого.
      - SENTRY_ENABLED=False
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    # X-Request-Id обязателен для КАЖДОГО запроса (rest/core/request_id.py
    # отвечает 400 без него), поэтому проба обязана его слать. Без заголовка
    # контейнер никогда не становился healthy, и набор падал ещё до первого
    # теста: "dependency failed to start: container ... is unhealthy".
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u,sys; r=u.Request('http://localhost:8000/api/openapi.json', headers={'X-Request-Id': 'healthcheck'}); sys.exit(0 if u.urlopen(r, timeout=3).status == 200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  tests:
    image: practix/movies-api:test
    environment:
      # Кеш pytest пишется в рабочий каталог, принадлежащий appuser. Раньше из-за
      # этого два тестовых сервиса запускались от root; отключение кеша решает
      # задачу без повышения прав.
      - PYTEST_ADDOPTS=-p no:cacheprovider
      - ES_HOST=http://elasticsearch:9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_URL=http://fastapi:8000
      # Трассировка выключена: Jaeger в тестовом стеке нет, а экспортёр иначе
      # засоряет вывод повторами неудачных отправок спанов.
      - OTEL_ENABLED=False
      # Сбор ошибок выключен по той же причине: приёмника в тестовом
      # стеке нет. Код-дефолт и так False, но явное лучше подразумеваемого.
      - SENTRY_ENABLED=False
    depends_on:
      fastapi:
        condition: service_healthy
    # Никаких `pip install` в entrypoint: pytest и pytest-asyncio приезжают в
    # образе (requirements.txt собран с корневым constraints.txt), поэтому все
    # наборы гарантированно идут на одной версии раннера.
    entrypoint: >
      sh -c "python3 -m practix_testing.utils.wait_for_es
      && python3 -m practix_testing.utils.wait_for_redis
      && pytest /opt/app/apps/movies-api/tests/functional -v"

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: auth_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-tests:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: auth
      args:
        PACKAGE: practix-auth
        UV_GROUPS: --group test
    image: practix/auth:test
    environment:
      # Кеш pytest пишется в рабочий каталог, принадлежащий appuser. Раньше из-за
      # этого два тестовых сервиса запускались от root; отключение кеша решает
      # задачу без повышения прав.
      - PYTEST_ADDOPTS=-p no:cacheprovider
      - AUTH_POSTGRES_HOST=auth-db
      - AUTH_POSTGRES_PORT=5432
      - AUTH_POSTGRES_USER=postgres
      - AUTH_POSTGRES_PASSWORD=secret
      - AUTH_POSTGRES_DB=auth_database
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OAUTH_ENABLED=True
      # Трассировка выключена: Jaeger в тестовом стеке нет, а экспортёр иначе
      # засоряет вывод повторами неудачных отправок спанов.
      - OTEL_ENABLED=False
      # Сбор ошибок выключен по той же причине: приёмника в тестовом
      # стеке нет. Код-дефолт и так False, но явное лучше подразумеваемого.
      - SENTRY_ENABLED=False
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ENTRYPOINT образа НЕ переопределяется, и это принципиально: entrypoint.sh
    # создаёт .env из .env.example. Настройки Auth (в отличие от остальных
    # сервисов) содержат поля без значений по умолчанию — PROJECT_NAME,
    # JWT_SECRET_KEY, BASE_DIR, AUTHJWT_* и другие, — поэтому без .env импорт
    # приложения падает с ValidationError ещё на сборе тестов. Сам .env в образ
    # не попадает: он в .dockerignore.
    #
    # working_dir тоже не переопределяем: pydantic-settings ищет .env
    # относительно текущего каталога, а entrypoint.sh кладёт его в WORKDIR
    # образа (/opt/app/auth). Переменные из `environment` выше приоритетнее
    # значений из файла, так что адреса БД и Redis остаются тестовыми.
    #
    # pytest и pytest-asyncio приезжают в образе (auth/requirements.txt собран
    # с корневым constraints.txt) — раньше здесь стоял `pip install` без
    # закрепления версий, то есть каждый прогон мог получить другой раннер.
    command: ["pytest", "/opt/app/apps/auth/tests/functional", "-v"]

  ugc-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ugc_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ugc_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Имя `ugc-tests` уже занято набором коллектора (ниже в этом файле), поэтому
  # набор сервиса пользовательского контента называется ugc-api-tests.
  ugc-api-tests:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: ugc-api
      args:
        PACKAGE: practix-ugc-api
        UV_GROUPS: --group test
    image: practix/ugc-api:test
    environment:
      - PYTEST_ADDOPTS=-p no:cacheprovider
      - UGC_API_POSTGRES_HOST=ugc-db
      - UGC_API_POSTGRES_PORT=5432
      - UGC_API_POSTGRES_USER=postgres
      - UGC_API_POSTGRES_PASSWORD=secret
      - UGC_API_POSTGRES_DB=ugc_database
      # Денилист отозванных токенов сервис читает из Redis Auth-сервиса.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Тот же секрет, которым practix_testing подписывает тестовые токены.
      - AUTHJWT_SECRET_KEY=secret
      - OTEL_ENABLED=False
      # Сбор ошибок выключен по той же причине: приёмника в тестовом
      # стеке нет. Код-дефолт и так False, но явное лучше подразумеваемого.
      - SENTRY_ENABLED=False
    depends_on:
      ugc-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ENTRYPOINT и working_dir не переопределяются — см. подробный комментарий у
    # auth-tests: entrypoint.sh создаёт .env из .env.example, а pydantic-settings
    # ищет .env относительно рабочего каталога образа.
    command: ["pytest", "/opt/app/apps/ugc-api/tests/functional", "-v"]

  shortener-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shortener_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortener_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Имя с префиксом сервиса, как у ugc-api-tests: короткое `shortener-tests`
  # однажды столкнулось бы с набором чужого сервиса ровно так же.
  #
  # Auth в зависимостях НЕТ: набор подменяет его заглушкой через
  # dependency_overrides — он проверяет поведение шортенера, а не Auth. Сквозной
  # путь до настоящего Auth проверяет набор нотификаций.
  link-shortener-tests:
    build: *shortener-test-build
    image: practix/link-shortener:test
    environment:
      - PYTEST_ADDOPTS=-p no:cacheprovider
      - SHORTENER_POSTGRES_HOST=shortener-db
      - SHORTENER_POSTGRES_PORT=5432
      - SHORTENER_POSTGRES_USER=postgres
      - SHORTENER_POSTGRES_PASSWORD=secret
      - SHORTENER_POSTGRES_DB=shortener_database
      - SHORTENER_PUBLIC_BASE_URL=http://localhost
      - SHORTENER_ALLOWED_REDIRECT_HOSTS=localhost,127.0.0.1
      - OTEL_ENABLED=False
      - SENTRY_ENABLED=False
    depends_on:
      shortener-db:
        condition: service_healthy
    # ENTRYPOINT и working_dir не переопределяются — см. подробный комментарий у
    # auth-tests: entrypoint.sh создаёт .env из .env.example, а pydantic-settings
    # ищет .env относительно рабочего каталога образа.
    command: ["pytest", "/opt/app/apps/link-shortener/tests/functional", "-v"]

  # Один брокер вместо трёх: тесты проверяют логику сервиса, а не
  # отказоустойчивость кластера, и лишние два узла только замедляют прогон.
  # Отсюда же RF=1 и min.insync.replicas=1 — с RF=3 на одном узле создание
  # топиков просто не прошло бы.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init-test:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REPLICATION_FACTOR: "1"
      MIN_INSYNC_REPLICAS: "1"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../../apps/analytics-collector/scripts/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh"]

  ugc-tests:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: analytics-collector
      args:
        PACKAGE: practix-analytics-collector
        UV_GROUPS: --group test
    image: practix/analytics-collector:test
    environment:
      # Кеш pytest пишется в рабочий каталог, принадлежащий appuser. Раньше из-за
      # этого два тестовых сервиса запускались от root; отключение кеша решает
      # задачу без повышения прав.
      - PYTEST_ADDOPTS=-p no:cacheprovider
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Собственные данные набора — в своём экземпляре Redis, денилист токенов
      # (его ведёт Auth) — в общем, как и в боевом compose.
      - UGC_REDIS_HOST=redis-ugc
      - UGC_REDIS_DB=0
      - AUTH_REDIS_HOST=redis
      - AUTH_REDIS_DB=0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UGC_ENV=test
      # Трассировка выключена: Jaeger в тестовом стеке нет, а экспортёр иначе
      # засоряет вывод повторами неудачных отправок спанов.
      - OTEL_ENABLED=False
      # Сбор ошибок выключен по той же причине: приёмника в тестовом
      # стеке нет. Код-дефолт и так False, но явное лучше подразумеваемого.
      - SENTRY_ENABLED=False
      # Метрики в тестах ведёт один процесс — multiprocess-режим не нужен.
      - PROMETHEUS_MULTIPROC_DIR=
    depends_on:
      kafka-init-test:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-ugc:
        condition: service_healthy
    working_dir: /opt/app
    # root нужен, чтобы pytest мог писать кеш в /opt/app (образ работает от
    # непривилегированного appuser).
    entrypoint: >
      sh -c "python3 -m practix_testing.utils.wait_for_kafka
      && pytest /opt/app/apps/analytics-collector/tests/functional -v"

  # --- Стенд ETL Kafka -> ClickHouse ---------------------------------------
  # Один узел ClickHouse со ВСТРОЕННЫМ Keeper. Встроенный — только здесь: в
  # боевой топологии он падал бы вместе с сервером, но тестам он нужен, потому
  # что без Keeper не работают ни Replicated*MergeTree, ни ON CLUSTER, а с ним
  # применяются те же самые файлы etl_clickhouse/ddl/*.sql, что и на бою.
  # Второй набор DDL «для тестов» неизбежно разъехался бы с боевым.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    hostname: clickhouse
    environment:
      CH_PASSWORD: etl
    volumes:
      - ../clickhouse/config/test/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ../clickhouse/config/test/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ../clickhouse/config/test/keeper-embedded.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ../clickhouse/config/test/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ../clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/config/users.d/etl.xml:/etc/clickhouse-server/users.d/etl.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  clickhouse-init-test:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CH_INIT_HOST: clickhouse
      CH_CLUSTER: ugc_cluster
      CH_DATABASE: ugc
      CH_USER: etl
      CH_PASSWORD: etl
      # Единственное отличие от боевого запуска того же скрипта.
      CH_EXPECTED_NODES: "1"
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ../../apps/etl-clickhouse/ddl:/ddl:ro
      - ../../apps/etl-clickhouse/scripts/apply_ddl.sh:/apply_ddl.sh:ro
    entrypoint: ["/bin/bash", "/apply_ddl.sh"]

  # Управляемый отказ хранилища для test_storage_outage.py. Прокси, а не
  # `docker compose stop`: не нужен docker-сокет внутри контейнера тестов и
  # нет зависимости от имени compose-проекта.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ../../apps/etl-clickhouse/tests/functional/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  etl-clickhouse:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: etl-clickhouse
      args:
        PACKAGE: practix-etl-clickhouse
        UV_GROUPS: --group test
    image: practix/etl-clickhouse:test
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # ETL ходит в хранилище ЧЕРЕЗ прокси, а тесты — напрямую.
      - CH_HOSTS=toxiproxy:8123
      - CH_USER=etl
      - CH_PASSWORD=etl
      - CH_DATABASE=ugc
      - ETL_CONSUMER_GROUP=ugc-clickhouse-etl-test
      # Кворум 2 недостижим при единственной реплике — все вставки падали бы.
      - CH_INSERT_QUORUM=0
      # Пороги ниже боевых: тест не должен ждать по две секунды на каждый флаш.
      - ETL_FLUSH_INTERVAL=1.0
      - ETL_BATCH_MAX_ROWS=100
      - CH_RETRY_MAX_DELAY=3.0
      - CH_SEND_RECEIVE_TIMEOUT=10
      # Тест проверяет, что метрики tracemalloc заполняются.
      - ETL_TRACEMALLOC_ENABLED=True
      - ETL_TRACEMALLOC_INTERVAL=10.0
      # Jaeger в тестовом стеке нет, а экспортёр иначе засоряет вывод
      # повторами неудачных отправок спанов (как в ugc-tests).
      - OTEL_ENABLED=False
      # Сбор ошибок выключен по той же причине: приёмника в тестовом
      # стеке нет. Код-дефолт и так False, но явное лучше подразумеваемого.
      - SENTRY_ENABLED=False
      - LOG_JSON=False
    depends_on:
      kafka-init-test:
        condition: service_completed_successfully
      clickhouse-init-test:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started

  etl-tests:
    image: practix/etl-clickhouse:test
    environment:
      # Кеш pytest пишется в рабочий каталог, принадлежащий appuser. Раньше из-за
      # этого два тестовых сервиса запускались от root; отключение кеша решает
      # задачу без повышения прав.
      - PYTEST_ADDOPTS=-p no:cacheprovider
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Напрямую, минуя toxiproxy: тест обязан видеть хранилище даже тогда,
      # когда для ETL оно «сломано».
      - CH_HOST=clickhouse
      - CH_PORT=8123
      - CH_USER=etl
      - CH_PASSWORD=etl
      - CH_DATABASE=ugc
      # Настройки для ClickHouseSink, который тест поднимает сам
      # (test_idempotency.py: падение между вставкой и коммитом). Адрес — тот
      # же прямой, что и у клиента тестов; кворум 2 недостижим при единственной
      # реплике, как и у самого ETL на этом стенде.
      - CH_HOSTS=clickhouse:8123
      - CH_INSERT_QUORUM=0
      - ETL_CONSUMER_GROUP=ugc-clickhouse-etl-test
      - ETL_METRICS_URL=http://etl-clickhouse:8000/metrics
      - TOXIPROXY_URL=http://toxiproxy:8474
    depends_on:
      etl-clickhouse:
        condition: service_healthy
    working_dir: /opt/app
    # Как и в ugc-tests: root нужен, чтобы pytest мог писать кеш в /opt/app.
    entrypoint: >
      sh -c "python3 -m practix_testing.utils.wait_for_kafka
      && python3 -m practix_testing.utils.wait_for_clickhouse
      && pytest /opt/app/apps/etl-clickhouse/tests/functional -v"

  # ==================== Стенд сервиса нотификаций =========================
  # Postgres, RabbitMQ, Mailpit и Auth — настоящие: проверяется именно то, что
  # ломается на живой инфраструктуре (топология очередей, идемпотентность,
  # dead-letters, поход воркера за личными данными), а не то, что и так покрыто
  # юнит-тестами на заглушках.
  #
  # ЛОВУШКА ОБЩЕЙ БАЗЫ. Набор auth-tests работает с той же auth-db и делает
  # `drop_all`/`create_all`, а `drop_all` НЕ удаляет таблицу alembic_version.
  # Если запустить наборы подряд без `down -v`, `alembic upgrade head` ниже
  # решит, что он уже на последней ревизии, и не создаст ни одной таблицы.
  # Правило «один набор за раз на чистом стенде» здесь не рекомендация.
  auth-migrations:
    build: *auth-test-build
    image: practix/auth:test-server
    environment: *auth-test-env
    depends_on:
      auth-db:
        condition: service_healthy
    # ENTRYPOINT образа не переопределяется (см. комментарий у auth-tests):
    # он создаёт .env, без которого настройки Auth не собираются.
    command: ["sh", "-c", "alembic -c apps/auth/alembic.ini upgrade head"]

  auth:
    build: *auth-test-build
    image: practix/auth:test-server
    environment: *auth-test-env
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrations:
        condition: service_completed_successfully
    # Проба обязана слать X-Request-Id: без заголовка RequestIdMiddleware
    # отвечает 400 ещё до обработчика, и контейнер никогда не станет healthy.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; r=u.Request('http://127.0.0.1:8000/api/openapi.json', headers={'X-Request-Id': 'healthcheck'}); sys.exit(0 if u.urlopen(r, timeout=3).status == 200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Служебная учётка, под которой сервис нотификаций ходит в Auth. Заводится
  # штатным CLI, а не INSERT'ом: важно, чтобы это был обычный пользователь,
  # которого можно заблокировать, а не самовыписанный токен.
  #
  # Подкоманда пишется ЯВНО: у Typer приложение с одной командой схлопывалось, но
  # команд стало две (см. practix_auth/cli.py), и схлопывание снято callback'ом.
  # Пароль передан явно, поэтому интерактивных запросов не будет.
  auth-service-account:
    build: *auth-test-build
    image: practix/auth:test-server
    environment: *auth-test-env
    depends_on:
      auth-migrations:
        condition: service_completed_successfully
      auth-db:
        condition: service_healthy
    command:
      - "python"
      - "-m"
      - "practix_auth.cli"
      - "createsuperuser"
      - "--login"
      - "svc-notifications"
      # Не `@practix.local`: pydantic EmailStr отвергает .local как
      # зарезервированный домен, и учётка не заводится.
      - "--email"
      - "svc-notifications@example.com"
      - "--password"
      - "Svc-Notify123!"

  # Учётка сервиса сокращения ссылок. Роль УЗКАЯ (`email-confirmer`), а не
  # `admin`: ему нужна ровно одна ручка — пометить адрес подтверждённым.
  auth-service-account-shortener:
    build: *auth-test-build
    image: practix/auth:test-server
    environment: *auth-test-env
    depends_on:
      auth-service-account:
        condition: service_completed_successfully
    command:
      - "python"
      - "-m"
      - "practix_auth.cli"
      - "create-service-account"
      - "--login"
      - "svc-link-shortener"
      - "--email"
      - "svc-link-shortener@example.com"
      - "--password"
      - "Svc-Short123!"
      - "--role"
      - "email-confirmer"

  notifications-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: notifications_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

  notifications-migrations:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: notifications
      args:
        PACKAGE: practix-notifications
        UV_GROUPS: --group test
    image: practix/notifications:test
    environment: *notifications-test-env
    depends_on:
      notifications-db:
        condition: service_healthy
    command: ["python", "-m", "practix_notifications.manage", "migrate", "--no-input"]

  notifications-admin:
    image: practix/notifications:test
    environment: *notifications-test-env
    depends_on:
      notifications-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      # Личный кабинет проверяет отзыв токена в Redis сервиса Auth.
      redis:
        condition: service_healthy

  # Формирующий воркер: ходит в Auth за именем, фамилией и адресом и собирает
  # письмо. Отсюда зависимости, которых нет у отправляющего.
  notifications-builder:
    image: practix/notifications:test
    environment: *notifications-test-env
    depends_on:
      notifications-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_healthy
      auth-service-account:
        condition: service_completed_successfully
    command: ["python", "-m", "practix_notifications.manage", "run_builder"]

  notifications-worker:
    image: practix/notifications:test
    environment: *notifications-test-env
    depends_on:
      notifications-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      # Общий слот темпа отправки лежит здесь же, где денилист (адрес приезжает
      # из якоря x-notifications-env).
      redis:
        condition: service_healthy
    command: ["python", "-m", "practix_notifications.manage", "run_worker"]

  notifications-scheduler:
    image: practix/notifications:test
    environment: *notifications-test-env
    depends_on:
      notifications-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "practix_notifications.manage", "run_scheduler"]

  # Websocket-шлюз. Свой образ (свой пакет и свой набор зависимостей), но тот же
  # брокер и тот же Redis, что у остальных: набор проверяет ВСЮ цепочку —
  # приём события → веер → сборка → WebsocketSender → fanout → сокет.
  notifications-ws:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: notifications-ws
      args:
        PACKAGE: practix-notifications-ws
    image: practix/notifications-ws:test
    environment:
      PYTEST_ADDOPTS: -p no:cacheprovider
      NOTIFY_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      AUTHJWT_SECRET_KEY: secret
      AUTH_REDIS_HOST: redis
      AUTH_REDIS_PORT: "6379"
      AUTH_REDIS_DB: "0"
      # Пять секунд вместо минуты — это минимум, который допускает валидатор
      # настроек, и опускать нижнюю границу ради теста нельзя: перепроверка идёт
      # НА КАЖДОЕ соединение, и секундный период превратил бы её в горячий цикл
      # запросов к Redis на проде.
      NOTIFY_WS_REVALIDATE_SECONDS: "5"
      # Короткий long-poll: набор проверяет и «пришло», и «истёк таймаут».
      NOTIFY_WS_POLL_TIMEOUT: "5"
      NOTIFY_WS_PING_INTERVAL: "5"
      # Низкий лимит намеренно: набор открывает сокеты и не всегда успевает
      # закрыть предыдущий, и при щедром значении утечка подписки прошла бы
      # незамеченной. Сам лимит проверяется юнит-тестом реестра.
      NOTIFY_WS_MAX_CONNECTIONS_PER_USER: "2"
      # Столько же поллеров: набору нужно достичь отказа тремя запросами, а не
      # десятью. Бюджеты раздельные, поэтому одно значение другое не задевает.
      NOTIFY_WS_MAX_POLLERS_PER_USER: "2"
      OTEL_ENABLED: "False"
      SENTRY_ENABLED: "False"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Сервис сокращения ссылок на стенде нотификаций — настоящий, а не заглушка:
  # сквозной тест разбирает ссылку прямо из письма и переходит по ней.
  #
  # SHORTENER_PUBLIC_BASE_URL указывает на КОНТЕЙНЕР, а не на http://localhost:
  # nginx на этом стенде нет, и ссылка из письма должна быть достижима из
  # контейнера тестов. В продакшене там внешний адрес.
  link-shortener:
    build: *shortener-test-build
    image: practix/link-shortener:test
    environment:
      SHORTENER_POSTGRES_HOST: shortener-db
      SHORTENER_POSTGRES_PORT: "5432"
      SHORTENER_POSTGRES_USER: postgres
      SHORTENER_POSTGRES_PASSWORD: secret
      SHORTENER_POSTGRES_DB: shortener_database
      SHORTENER_PUBLIC_BASE_URL: http://link-shortener:8000
      SHORTENER_ALLOWED_REDIRECT_HOSTS: localhost,127.0.0.1
      SHORTENER_INTERNAL_TOKEN: test-shortener-token
      SHORTENER_AUTH_API_URL: http://auth:8000
      SHORTENER_AUTH_SERVICE_LOGIN: svc-link-shortener
      SHORTENER_AUTH_SERVICE_PASSWORD: Svc-Short123!
      OTEL_ENABLED: "False"
      SENTRY_ENABLED: "False"
    depends_on:
      shortener-migrations:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      auth-service-account-shortener:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  shortener-migrations:
    build: *shortener-test-build
    image: practix/link-shortener:test
    environment:
      SHORTENER_POSTGRES_HOST: shortener-db
      SHORTENER_POSTGRES_PORT: "5432"
      SHORTENER_POSTGRES_USER: postgres
      SHORTENER_POSTGRES_PASSWORD: secret
      SHORTENER_POSTGRES_DB: shortener_database
    depends_on:
      shortener-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic -c apps/link-shortener/alembic.ini upgrade head"]

  notifications-tests:
    image: practix/notifications:test
    environment:
      <<: *notifications-test-env
      MAILPIT_URL: http://mailpit:8025
      RABBITMQ_API_URL: http://rabbitmq:15672
      NOTIFICATIONS_URL: http://notifications-admin:8000
      # Получатели заводятся настоящей регистрацией в Auth: только так у них
      # есть имя и фамилия, которые воркер потом подставит в письмо.
      AUTH_URL: http://auth:8000
      NOTIFICATIONS_WS_URL: http://notifications-ws:8000
      SHORTENER_URL: http://link-shortener:8000
    depends_on:
      notifications-admin:
        condition: service_healthy
      notifications-ws:
        condition: service_healthy
      link-shortener:
        condition: service_healthy
      notifications-builder:
        condition: service_started
      notifications-worker:
        condition: service_started
      notifications-scheduler:
        condition: service_started
      auth:
        condition: service_healthy
      # Тест отозванного токена пишет jti прямо в денилист.
      redis:
        condition: service_healthy
    entrypoint: >
      sh -c "python -m practix_testing.utils.wait_for_rabbitmq
      && python -m practix_testing.utils.wait_for_mailpit
      && pytest /opt/app/apps/notifications/tests/functional -v"
