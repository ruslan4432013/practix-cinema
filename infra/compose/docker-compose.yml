# Общая часть четырёх узлов ClickHouse. Различаются они только macros-файлом,
# volume'ом и опубликованными портами, поэтому всё остальное вынесено в якорь:
# иначе одну и ту же правку пришлось бы вносить в четыре места, и рано или
# поздно один из узлов от неё отстал бы.
x-clickhouse-server: &clickhouse-server
  image: clickhouse/clickhouse-server:25.3
  environment:
    CH_PASSWORD: ${CH_PASSWORD:-etl}
  depends_on:
    clickhouse-keeper-01:
      condition: service_healthy
    clickhouse-keeper-02:
      condition: service_healthy
    clickhouse-keeper-03:
      condition: service_healthy
  # Официальный образ требует поднятого лимита дескрипторов: MergeTree держит
  # открытыми файлы всех активных кусков, и при дефолтных 1024 сервер сыплется
  # «Too many open files» на первой же заметной нагрузке.
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  healthcheck:
    # /ping не требует авторизации, поэтому проба не зависит от пароля.
    test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s
  networks:
    - movies_net

# Keeper отличается между узлами только файлом конфигурации и volume'ом.
x-clickhouse-keeper: &clickhouse-keeper
  image: clickhouse/clickhouse-keeper:25.3
  healthcheck:
    # Четырёхбуквенная команда ruok — штатный healthcheck ZooKeeper-протокола:
    # отвечает imok только когда узел присоединился к кворуму.
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9181; printf ruok >&3; head -c4 <&3' | grep -q imok"]
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 15s
  networks:
    - movies_net

# ПРОФИЛИ. Без них `docker compose up` поднимал бы все 41 сервис, и стенду
# требовалось бы ≥16 ГБ памяти Docker — даже когда правишь только Movies API.
#
#   docker compose up -d                             # ядро (21 сервис)
#   docker compose --profile warehouse up -d         # 30: + ClickHouse, Keeper, ETL ClickHouse
#   docker compose --profile observability up -d     # 27: + Prometheus, Grafana, Kafka UI, GlitchTip
#   docker compose --profile logging up -d           # 26: + Elasticsearch(логи), Logstash, Kibana, Filebeat
#   docker compose --profile warehouse --profile observability --profile logging up -d   # всё (41)
#
# В профиль вынесено самое тяжёлое: 4 узла ClickHouse + 3 Keeper — это и есть
# основная часть тех ≥12 ГБ, а ELK добавляет к ним ещё около 2 ГБ.
#
# ЧЕГО В ПРОФИЛЯХ НЕТ И ПОЧЕМУ. Коллектор, redis-ugc и брокеры Kafka остались в
# ядре, хотя относятся к аналитике: Nginx резолвит имена апстримов ПРИ СТАРТЕ и
# падает с `[emerg] host not found in upstream "analytics-collector:8000"`, если
# сервиса нет в сети. Обойти это можно только формой `proxy_pass http://$var` с
# resolver'ом — а она обходит блок upstream и теряет keepalive к апстриму, что
# для ingest-ручки (самый горячий маршрут) дороже, чем удобство локального
# запуска. Продовую конфигурацию ради dev-удобства ухудшать не стоит.
#
# jaeger тоже в ядре: приложения пишут трассировку по умолчанию
# (OTEL_ENABLED=true), и без него экспортёр молотил бы в пустоту.
services:
  theatre-db:
    image: postgres:16
    container_name: theatre-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${THEATRE_DB_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../database_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./reset_django_auth.sql:/docker-entrypoint-initdb.d/zz_reset_django_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movies_net

  redis:
    image: redis:7-alpine
    container_name: redis
    # Без maxmemory Redis растёт до предела контейнера, а при дефолтной политике
    # noeviction начинает отвечать ошибкой на КАЖДУЮ запись — то есть отказ
    # выглядит как отказ Auth целиком, а не как деградация кэша.
    # volatile-lru вытесняет только ключи с TTL: под давлением жертвой
    # становятся записи кэша Movies API, а не структуры без TTL.
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - movies_net

  # Отдельный экземпляр под аналитику. Раньше буфер деградации, счётчики rate
  # limit и дедупликация коллектора жили в общем Redis (разведённые лишь по
  # номеру базы), то есть многочасовой отказ Kafka вытеснял бы из памяти сессии
  # Auth: авария в аналитике роняла бы вход на сайт. Разные экземпляры — разная
  # судьба при отказе.
  redis-ugc:
    image: redis:7-alpine
    container_name: redis-ugc
    # noeviction здесь — осознанный выбор, обратный соседнему. Буфер деградации
    # хранит ещё не доставленные события: вытеснить их значит потерять молча.
    # Отказ записи, наоборот, идёт по спроектированному пути — событие
    # отбрасывается с метрикой ugc_events_dropped_total и ERROR в логе.
    # Верхняя граница длины буфера (UGC_FALLBACK_MAX_SIZE) остаётся первым
    # рубежом, maxmemory — вторым.
    command: >
      redis-server
      --maxmemory ${UGC_REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
    volumes:
      - redis_ugc_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - movies_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTIC_HOST_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - movies_net

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"   # Jaeger UI
      - "${OTLP_GRPC_HOST_PORT:-4317}:4317"     # OTLP gRPC
      - "${OTLP_HTTP_HOST_PORT:-4318}:4318"     # OTLP HTTP
    networks:
      - movies_net

  # --- Кластер Kafka (KRaft, без ZooKeeper) --------------------------------
  # Три узла, каждый совмещает роли broker и controller. Такой размер выбран не
  # для нагрузки, а ради осмысленной отказоустойчивости: при RF=3 и
  # min.insync.replicas=2 кластер переживает потерю одного узла без остановки
  # записи и без потери данных. На одном брокере это не проверить.
  kafka-0:
    image: apache/kafka:3.9.1
    container_name: kafka-0
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      # Кворум контроллеров: перечислены все три узла.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT — трафик внутри сети Docker, EXTERNAL — доступ с хоста.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      # Служебные топики тоже реплицируем на три узла — иначе отказ одного
      # брокера уронил бы хранение оффсетов consumer-групп.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      # Автосоздание выключено: топики заводит kafka-init с проверенными
      # параметрами, а опечатка в имени топика должна быть видимой ошибкой,
      # а не молча созданным топиком с настройками по умолчанию.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA0_HOST_PORT:-9094}:9094"
    volumes:
      - kafka_0_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - movies_net

  kafka-1:
    image: apache/kafka:3.9.1
    container_name: kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://127.0.0.1:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA1_HOST_PORT:-9095}:9094"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - movies_net

  kafka-2:
    image: apache/kafka:3.9.1
    container_name: kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://127.0.0.1:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA2_HOST_PORT:-9096}:9094"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - movies_net

  # Одноразовая задача создания топиков — по образцу auth-migrations.
  # Идемпотентна (--if-not-exists), поэтому безопасно выполняется при каждом
  # подъёме стека.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    volumes:
      - ../../apps/analytics-collector/scripts/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    networks:
      - movies_net

  kafka-ui:
    profiles: ["observability"]
    # kafbat/kafka-ui — поддерживаемый форк provectuslabs/kafka-ui,
    # оригинальный репозиторий переведён в архив.
    image: kafbat/kafka-ui:v1.0.0
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: ugc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_HOST_PORT:-8081}:8080"
    depends_on:
      kafka-0:
        condition: service_healthy
    networks:
      - movies_net

  # --- Аналитическое хранилище: ClickHouse, 2 шарда x 2 реплики -------------
  #
  # Keeper поднимается первым: без кворума координации не работают ни
  # реплицируемые таблицы, ни ON CLUSTER-DDL, поэтому серверы ждут его healthy.
  clickhouse-keeper-01:
    profiles: ["warehouse"]
    <<: *clickhouse-keeper
    container_name: clickhouse-keeper-01
    volumes:
      - ../clickhouse/keeper/keeper-01.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ch_keeper_01_data:/var/lib/clickhouse-keeper

  clickhouse-keeper-02:
    profiles: ["warehouse"]
    <<: *clickhouse-keeper
    container_name: clickhouse-keeper-02
    volumes:
      - ../clickhouse/keeper/keeper-02.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ch_keeper_02_data:/var/lib/clickhouse-keeper

  clickhouse-keeper-03:
    profiles: ["warehouse"]
    <<: *clickhouse-keeper
    container_name: clickhouse-keeper-03
    volumes:
      - ../clickhouse/keeper/keeper-03.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ch_keeper_03_data:/var/lib/clickhouse-keeper

  # Шард 1, реплика 1. Единственный узел с published-портами по умолчанию —
  # через него удобно ходить clickhouse-client'ом с хоста.
  clickhouse-01:
    profiles: ["warehouse"]
    <<: *clickhouse-server
    container_name: clickhouse-01
    volumes:
      - ../clickhouse/config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ../clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/config/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ../clickhouse/config/macros/clickhouse-01.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ../clickhouse/config/users.d/etl.xml:/etc/clickhouse-server/users.d/etl.xml:ro
      - ch_01_data:/var/lib/clickhouse
    ports:
      - "${CH01_HTTP_HOST_PORT:-8123}:8123"   # HTTP
      - "${CH01_NATIVE_HOST_PORT:-9010}:9000"   # native (9000 на хосте занят слишком часто, поэтому 9010)

  clickhouse-02:
    profiles: ["warehouse"]
    <<: *clickhouse-server
    container_name: clickhouse-02
    volumes:
      - ../clickhouse/config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ../clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/config/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ../clickhouse/config/macros/clickhouse-02.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ../clickhouse/config/users.d/etl.xml:/etc/clickhouse-server/users.d/etl.xml:ro
      - ch_02_data:/var/lib/clickhouse
    ports:
      - "${CH02_HTTP_HOST_PORT:-8124}:8123"
      - "${CH02_NATIVE_HOST_PORT:-9011}:9000"

  clickhouse-03:
    profiles: ["warehouse"]
    <<: *clickhouse-server
    container_name: clickhouse-03
    volumes:
      - ../clickhouse/config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ../clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/config/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ../clickhouse/config/macros/clickhouse-03.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ../clickhouse/config/users.d/etl.xml:/etc/clickhouse-server/users.d/etl.xml:ro
      - ch_03_data:/var/lib/clickhouse
    ports:
      - "${CH03_HTTP_HOST_PORT:-8125}:8123"
      - "${CH03_NATIVE_HOST_PORT:-9012}:9000"

  clickhouse-04:
    profiles: ["warehouse"]
    <<: *clickhouse-server
    container_name: clickhouse-04
    volumes:
      - ../clickhouse/config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ../clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ../clickhouse/config/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ../clickhouse/config/macros/clickhouse-04.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ../clickhouse/config/users.d/etl.xml:/etc/clickhouse-server/users.d/etl.xml:ro
      - ch_04_data:/var/lib/clickhouse
    ports:
      - "${CH04_HTTP_HOST_PORT:-8126}:8123"
      - "${CH04_NATIVE_HOST_PORT:-9013}:9000"

  # Одноразовое применение DDL — по образцу kafka-init и auth-migrations.
  # Идемпотентно (IF NOT EXISTS в каждом операторе), поэтому безопасно
  # выполняется при каждом подъёме стека.
  clickhouse-init:
    profiles: ["warehouse"]
    image: clickhouse/clickhouse-server:25.3
    container_name: clickhouse-init
    depends_on:
      clickhouse-01:
        condition: service_healthy
      clickhouse-02:
        condition: service_healthy
      clickhouse-03:
        condition: service_healthy
      clickhouse-04:
        condition: service_healthy
    environment:
      CH_INIT_HOST: clickhouse-01
      CH_CLUSTER: ${CH_CLUSTER:-ugc_cluster}
      CH_DATABASE: ${CH_DATABASE:-ugc}
      CH_USER: ${CH_USER:-etl}
      CH_PASSWORD: ${CH_PASSWORD:-etl}
      CH_EXPECTED_NODES: "4"
    volumes:
      - ../../apps/etl-clickhouse/ddl:/ddl:ro
      - ../../apps/etl-clickhouse/scripts/apply_ddl.sh:/apply_ddl.sh:ro
    entrypoint: ["/bin/bash", "/apply_ddl.sh"]
    networks:
      - movies_net

  # --- Наблюдаемость: метрики и дашборды ------------------------------------
  # Jaeger (выше) отвечает на вопрос «где время в одном запросе», Prometheus —
  # на вопрос «как система живёт в целом», включая обязательный для спринта
  # контроль памяти ETL при непрерывном потоке.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Неделя истории: достаточно, чтобы увидеть форму кривой RSS на длинном
      # прогоне, и не превращает локальный стенд в хранилище метрик.
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - movies_net

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.0
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    networks:
      - movies_net

  # --- Сбор ошибок: GlitchTip ----------------------------------------------
  #
  # ПОЧЕМУ НЕ SENTRY. Официальная self-hosted сборка Sentry — это 16 ГБ RAM плюс
  # 16 ГБ swap, 4 ядра, 20 ГБ диска и ~40 контейнеров: Kafka, ClickHouse, Snuba,
  # Relay, Symbolicator, PgBouncer, memcached. Стенд уже просит ≥12 ГБ на
  # профиле warehouse, и вместе они на одной машине не живут.
  #
  # GlitchTip реализует ТОТ ЖЕ протокол приёма событий и работает с ОФИЦИАЛЬНЫМ
  # sentry-sdk без единой правки в коде — отличается только DSN. Цена: три
  # контейнера и ~512 МБ. Переезд на sentry.io или на настоящий Sentry — это
  # замена SENTRY_DSN в .env, приложения этого не заметят.
  #
  # GlitchTip НЕ добавляется в upstream nginx намеренно: nginx резолвит апстримы
  # при старте и падает, если сервиса нет в сети (см. шапку файла), а этот сервис
  # по умолчанию выключен профилем. Доступ — по опубликованному порту.
  glitchtip-db:
    profiles: ["observability"]
    image: postgres:16
    container_name: glitchtip-db
    environment:
      POSTGRES_USER: ${GLITCHTIP_POSTGRES_USER:-glitchtip}
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD:-glitchtip}
      POSTGRES_DB: ${GLITCHTIP_POSTGRES_DB:-glitchtip}
    volumes:
      - glitchtip_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GLITCHTIP_POSTGRES_USER:-glitchtip} -d ${GLITCHTIP_POSTGRES_DB:-glitchtip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movies_net

  # Отдельный экземпляр, а не общий redis: тот держит сессии Auth под
  # volatile-lru, и очередь задач GlitchTip вытесняла бы их под давлением.
  # Правило стенда «разные экземпляры — разная судьба при отказе».
  glitchtip-valkey:
    profiles: ["observability"]
    image: valkey/valkey:9-alpine
    container_name: glitchtip-valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - movies_net

  glitchtip:
    profiles: ["observability"]
    image: glitchtip/glitchtip:6
    container_name: glitchtip
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    environment:
      # all_in_one поднимает web, worker и beat в одном процессе. Отдельный
      # контейнер воркера нужен под нагрузкой, которой у стенда нет.
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://${GLITCHTIP_POSTGRES_USER:-glitchtip}:${GLITCHTIP_POSTGRES_PASSWORD:-glitchtip}@glitchtip-db:5432/${GLITCHTIP_POSTGRES_DB:-glitchtip}
      VALKEY_URL: redis://glitchtip-valkey:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change_me_to_something_random}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      ENABLE_OPEN_USER_REGISTRATION: ${GLITCHTIP_ENABLE_OPEN_USER_REGISTRATION:-true}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-glitchtip@example.com}
    ports:
      - "${GLITCHTIP_HOST_PORT:-8001}:8000"
    volumes:
      - glitchtip_uploads:/code/uploads
    networks:
      - movies_net

  # --- Логи: ELK (профиль logging) ------------------------------------------
  #
  # ОТДЕЛЬНЫЙ Elasticsearch, а не соседний индекс в существующем. Причина не в
  # объёме: у поискового индекса каталога и у потока логов разная судьба при
  # аварии. Лог растёт непрерывно, и первый же день без ротации упирается в
  # диск — вместе с ним встал бы поиск фильмов, то есть отказ ИНСТРУМЕНТА
  # наблюдения уронил бы НАБЛЮДАЕМОЕ. Отдельный узел делает эту связь
  # невозможной по построению — то же правило, по которому redis-ugc отделён от
  # redis, а ugc-db от theatre-db.
  #
  # ДОСТАВКА: json-file -> Filebeat -> Logstash -> ES. Драйвер gelf не
  # используется намеренно: он шлёт по UDP без подтверждения, и перезапуск
  # Logstash теряет логи молча; кроме того, при не-json-file драйвере перестаёт
  # работать `docker compose logs`, которым стенд пользуются каждый день.
  # Приложения ничего не знают о получателе логов и просто пишут в stdout.
  #
  # НИ ОДИН сервис ядра не получает depends_on на logstash — намеренно:
  # конвейер логов не имеет права блокировать приложение. При выключенном
  # профиле сервисы пишут в stdout как обычно, а Filebeat дочитает файлы, когда
  # его поднимут.
  elasticsearch-logs:
    profiles: ["logging"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: elasticsearch-logs
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Имя кластера отличается от соседнего узла намеренно: два single-node
      # кластера в одной сети с ОДИНАКОВЫМ именем — заготовка для путаницы в
      # диагностике («смотрю health не того узла»).
      - cluster.name=practix-logs
      - ES_JAVA_OPTS=${ES_LOGS_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      # 9200 занят поисковым узлом, а 9201 у разработчика часто занят им же
      # (ELASTIC_HOST_PORT), поэтому по умолчанию 9210 — по той же причине, по
      # которой native-порты ClickHouse съехали на 9010.
      - "${ELASTIC_LOGS_HOST_PORT:-9210}:9200"
    volumes:
      - es_logs_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - movies_net

  # Шаблон индекса ОБЯЗАН примениться до первой записи: без него тип поля
  # закрепляет тот, кто записал первым. На живом стенде первым про `status`
  # написал Jaeger — строкой, — и диапазонные запросы по коду ответа nginx
  # перестали работать молча. Одноразовый контейнер по образцу kafka-init.
  elasticsearch-logs-init:
    profiles: ["logging"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
    container_name: elasticsearch-logs-init
    depends_on:
      elasticsearch-logs:
        condition: service_healthy
    volumes:
      - ../elk/scripts/apply_index_template.sh:/apply_index_template.sh:ro
    entrypoint: ["/bin/bash", "/apply_index_template.sh"]
    networks:
      - movies_net

  logstash:
    profiles: ["logging"]
    image: docker.elastic.co/logstash/logstash:9.4.1
    container_name: logstash
    depends_on:
      elasticsearch-logs:
        condition: service_healthy
      elasticsearch-logs-init:
        condition: service_completed_successfully
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      # Публикуется ради отладки: в порт можно постучаться руками и отличить
      # «Logstash не принимает» от «Filebeat не отправляет».
      - "${LOGSTASH_BEATS_HOST_PORT:-5044}:5044"
    healthcheck:
      # 9600 отвечает только после того, как пайплайн собран и запущен. Без
      # этого условия Filebeat стартовал бы раньше и писал ошибки соединения в
      # закрытый 5044.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - ../elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ../elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      # Том ОБЯЗАТЕЛЕН: на нём лежат persisted queue и dead letter queue. Без
      # него обе включённые в logstash.yml гарантии живут ровно до перезапуска.
      - logstash_data:/usr/share/logstash/data
    networks:
      - movies_net

  kibana:
    profiles: ["logging"]
    image: docker.elastic.co/kibana/kibana:9.4.1
    container_name: kibana
    depends_on:
      elasticsearch-logs:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch-logs:9200"]'
      SERVER_PUBLICBASEURL: http://localhost:${KIBANA_HOST_PORT:-5601}
      # Без явного ключа Kibana генерирует новый на КАЖДЫЙ старт и теряет
      # сохранённые объекты: созданный data view исчезает после перезапуска, и
      # выглядит это как «Kibana перестала видеть индекс».
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-practix_kibana_saved_objects_key_32b}
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - kibana_data:/usr/share/kibana/data
    networks:
      - movies_net

  filebeat:
    profiles: ["logging"]
    image: docker.elastic.co/beats/filebeat:9.4.1
    container_name: filebeat
    # root ОБЯЗАТЕЛЕН и проверен: каталоги /var/lib/docker/containers/<id>/ имеют
    # режим 0700, файлы — 0640, владелец root. От непривилегированного
    # пользователя Filebeat стартует штатно и МОЛЧА не находит ни одного файла:
    # ошибок нет, индекс пустой — самый дорогой способ отладки из возможных.
    user: root
    # --strict.perms=false: Filebeat отказывается стартовать, если конфиг
    # доступен на запись группе или остальным («config file must be owned by
    # root»). На macOS bind-mount отдаёт файл как root:root 0644 и проверка
    # проходит, но на Linux-хосте с umask 002 файл приезжает 0664 — и контейнер
    # падает там, где у разработчика всё работало.
    command: ["--strict.perms=false", "-e"]
    depends_on:
      logstash:
        condition: service_healthy
    environment:
      # Имя проекта compose — единственный признак «наш контейнер», доступный
      # до разбора содержимого строки. По нему Filebeat отсеивает контейнеры
      # других проектов, запущенные на той же машине.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-compose}
    healthcheck:
      # --strict.perms=false нужен и здесь: healthcheck запускает ОТДЕЛЬНЫЙ
      # процесс filebeat, и без флага он упал бы на той же проверке прав, что и
      # основной, — контейнер выглядел бы unhealthy при работающем сборщике.
      #
      # ТАЙМИНГИ ИЗМЕРЕНЫ, а не взяты по аналогии с соседями. `test output` — не
      # ping: он поднимает полноценный инстанс beat'а с чтением конфига и
      # реестра, и на этом стенде стабильно занимает ~16 с. С обычными для файла
      # `timeout: 5s` контейнер уходил в unhealthy при исправно работающем
      # сборщике — проверка отваливалась по времени, ни разу не дойдя до вывода.
      # Интервал 2 минуты по той же причине: запускать 16-секундный процесс раз
      # в полминуты дороже самой работы.
      test: ["CMD-SHELL", "filebeat --strict.perms=false test output | grep -q 'talk to server... OK' || exit 1"]
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      - ../elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Логи всех контейнеров хоста. На Docker Desktop путь резолвится ВНУТРИ
      # виртуальной машины (на самой macOS такого каталога нет) — это работает
      # и отдельной настройки file sharing не требует.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Сокет — только ради add_docker_metadata (имя контейнера и метки
      # compose), :ro. Права на сокет = права на docker-демон.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Реестр смещений. Без тома перезапуск сборщика перечитывает все файлы с
      # начала, и в Kibana появляется вся история заново.
      - filebeat_data:/usr/share/filebeat/data
    networks:
      - movies_net

  # --- Сервис сбора пользовательских действий ------------------------------
  analytics-collector:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: analytics-collector
      args:
        PACKAGE: practix-analytics-collector
    image: practix/analytics-collector:local
    container_name: analytics-collector
    env_file:
      - ../../.env
    environment:
      OTEL_SERVICE_NAME: analytics-collector
      # Собственные данные коллектора (буфер, rate limit, дедуп) — в отдельном
      # экземпляре Redis. Денилист токенов остаётся в общем: его ведёт Auth, и
      # читать его надо там, где он пишется (см. AUTH_REDIS_* ниже).
      UGC_REDIS_HOST: redis-ugc
      UGC_REDIS_DB: "0"
      AUTH_REDIS_HOST: redis
      AUTH_REDIS_DB: "0"
    expose:
      - "8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-ugc:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - movies_net

  # ETL Kafka -> ClickHouse: переносит поток пользовательских действий в
  # аналитическое хранилище. Не путать с сервисом `etl` ниже — тот про
  # PostgreSQL -> Elasticsearch и к аналитике отношения не имеет.
  etl-clickhouse:
    profiles: ["warehouse"]
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: etl-clickhouse
      args:
        PACKAGE: practix-etl-clickhouse
    image: practix/etl-clickhouse:local
    container_name: etl-clickhouse
    env_file:
      - ../../.env
    environment:
      OTEL_SERVICE_NAME: etl-clickhouse
    ports:
      # Публикуем метрики наружу: без них проверка «не течёт ли приложение»
      # требовала бы заходить внутрь сети.
      - "${ETL_METRICS_HOST_PORT:-9101}:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
    networks:
      - movies_net

  etl:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: etl-elasticsearch
      args:
        PACKAGE: practix-etl-elasticsearch
    image: practix/etl-elasticsearch:local
    container_name: etl
    env_file:
      - ../../.env
    environment:
      STATE_FILE_PATH: /var/lib/etl/etl_state.json
      # Трассировки у этого сервиса нет, но имя нужно сборщику ошибок: под ним
      # он подписывает события тегом `service`.
      OTEL_SERVICE_NAME: etl-elasticsearch
    depends_on:
      theatre-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - etl_state:/var/lib/etl
    networks:
      - movies_net

  django-migrations:
    build:
      context: ../../apps/django-admin
    container_name: django-migrations
    env_file:
      - ../../.env
    depends_on:
      theatre-db:
        condition: service_healthy
    entrypoint: []
    command: >
      bash -c "python manage.py migrate --no-input
      && python manage.py collectstatic --no-input
      && (python manage.py createsuperuser --no-input || true)"
    volumes:
      - static_volume:/opt/app/static/
    networks:
      - movies_net

  django-admin:
    build:
      context: ../../apps/django-admin
    container_name: django-admin
    env_file:
      - ../../.env
    environment:
      OTEL_SERVICE_NAME: django-admin
    expose:
      - "8000"
    depends_on:
      django-migrations:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    # Готовность именно приложения, а не контейнера: короткая форма depends_on
    # у Nginx гарантировала только запуск процесса, поэтому сразу после
    # `docker compose up` Nginx какое-то время отдавал 502.
    # Проба ОБЯЗАНА слать X-Request-Id: RequestIdMiddleware у Django отклоняет
    # запрос без него с 400 (см. example/middleware.py) — точно так же, как
    # middleware у FastAPI-сервисов.
    #
    # Без заголовка проба не проходила никогда, django-admin навсегда оставался
    # unhealthy, а Nginx ждёт от него именно healthy — то есть `docker compose up`
    # не поднимал рабочий стенд вообще. У остальных сервисов заголовок в пробе был,
    # здесь его забыли.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.Request('http://127.0.0.1:8000/admin/login/', headers={'X-Request-Id': 'healthcheck'}); sys.exit(0 if urllib.request.urlopen(r, timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - static_volume:/opt/app/static/
    networks:
      - movies_net

  nginx:
    image: nginx:1.25.3
    container_name: nginx
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/configs:/etc/nginx/conf.d:ro
      - static_volume:/data/static/
    # Форма с condition, а не короткий список: короткая ждёт лишь СТАРТА
    # контейнера, а не готовности приложения в нём. Auth добавлен в список
    # явно — маршруты /api/v1/{auth,roles,users} ведут в него.
    depends_on:
      django-admin:
        condition: service_healthy
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
      # required: false — коллектор живёт в профиле `analytics`, и без него Nginx
      # обязан подниматься: ядро сайта (каталог, вход, админка) от аналитики не
      # зависит. Без этого флага compose отказывался строить проект вовсе,
      # потому что depends_on ссылался на сервис вне активного профиля.
      # Маршрут /api/v1/events при выключенном профиле ответит 502 — это
      # правильная деградация, а не поломка.
      analytics-collector:
        condition: service_healthy
        required: false
      # Без required: false — в отличие от коллектора, сервис UGC живёт в ядре,
      # а не в профиле. Причина техническая: Nginx резолвит имена upstream'ов при
      # старте и падает с `host not found in upstream`, если контейнера нет.
      ugc-api:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    networks:
      - movies_net

  api:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: movies-api
      args:
        PACKAGE: practix-movies-api
    image: practix/movies-api:local
    container_name: api
    env_file:
      - ../../.env
    environment:
      OTEL_SERVICE_NAME: movies-api
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      jaeger:
        condition: service_started
    # X-Request-Id обязателен для любого запроса (см. rest/core/request_id.py),
    # поэтому проба шлёт заголовок — иначе она получала бы 400 и сервис никогда
    # не становился бы healthy.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; r=u.Request('http://127.0.0.1:8000/api/openapi.json', headers={'X-Request-Id': 'healthcheck'}); sys.exit(0 if u.urlopen(r, timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - movies_net

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "${AUTH_DB_HOST_PORT:-5433}:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movies_net

  # Образ ТОТ ЖЕ, что у сервиса `auth`, только с другой командой — миграции и
  # приложение обязаны запускаться из одного набора байт, иначе Alembic мог бы
  # применять миграции не той версии, что ждёт приложение.
  #
  # `build` объявлен у самого `auth` (ниже), а не здесь. Раньше было наоборот, и
  # это создавало неявную зависимость, замаскированную под тег: образ `auth`
  # существовал только потому, что compose успевал собрать `auth-migrations`
  # первым. Сервис, которому образ принадлежит, теперь его и собирает.
  auth-migrations:
    image: practix/auth:local
    container_name: auth-migrations
    env_file:
      - ../../.env
    depends_on:
      auth-db:
        condition: service_healthy
    # -c с явным путём, а не смена working_dir: рабочий каталог образа (/opt/app)
    # менять нельзя — entrypoint создаёт там .env из лежащего рядом .env.example,
    # а pydantic-settings ищет .env относительно текущего каталога.
    # script_location в alembic.ini задан через %(here)s, поэтому migrations
    # находятся относительно самого ini-файла, а не относительно CWD.
    command: >
      sh -c "alembic -c apps/auth/alembic.ini upgrade head"
    networks:
      - movies_net

  auth:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: auth
      args:
        PACKAGE: practix-auth
    image: practix/auth:local
    container_name: auth
    env_file:
      - ../../.env
    environment:
      OTEL_SERVICE_NAME: auth-service
    expose:
      - "8000"
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrations:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    # Как и у Movies API, проба обязана слать X-Request-Id: без заголовка
    # middleware отвечает 400 (см. practix_core.request_id).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; r=u.Request('http://127.0.0.1:8000/api/openapi.json', headers={'X-Request-Id': 'healthcheck'}); sys.exit(0 if u.urlopen(r, timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - movies_net

  # Своя база, а не таблицы в theatre-db или auth-db. Причина в выводах
  # research/ugc-storage/README.md: профиль нагрузки UGC (чтений на порядок
  # больше записей, запись конкурирует за преагрегат) не должен влиять на
  # каталог и на вход в систему.
  ugc-db:
    image: postgres:16
    container_name: ugc-db
    environment:
      POSTGRES_USER: ${UGC_API_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UGC_API_POSTGRES_PASSWORD}
      POSTGRES_DB: ${UGC_API_POSTGRES_DB}
    # 5432 — theatre-db, 5433 — auth-db, 5434 по умолчанию занимает стенд
    # исследования (research/ugc-storage/.env.example).
    ports:
      - "${UGC_DB_HOST_PORT:-5435}:5432"
    volumes:
      - ugc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UGC_API_POSTGRES_USER} -d ${UGC_API_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movies_net

  # Образ тот же, что у `ugc-api`, и по той же причине, что у auth-migrations:
  # миграции и приложение обязаны запускаться из одного набора байт. `build`
  # объявлен у сервиса, которому образ принадлежит.
  ugc-migrations:
    image: practix/ugc-api:local
    container_name: ugc-migrations
    env_file:
      - ../../.env
    depends_on:
      ugc-db:
        condition: service_healthy
    # -c с явным путём, а не смена working_dir: рабочий каталог образа менять
    # нельзя — entrypoint создаёт там .env из .env.example.
    command: >
      sh -c "alembic -c apps/ugc-api/alembic.ini upgrade head"
    networks:
      - movies_net

  ugc-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      target: ugc-api
      args:
        PACKAGE: practix-ugc-api
    image: practix/ugc-api:local
    container_name: ugc-api
    env_file:
      - ../../.env
    environment:
      OTEL_SERVICE_NAME: ugc-api
      UGC_API_POSTGRES_HOST: ugc-db
      UGC_API_POSTGRES_PORT: 5432
    expose:
      - "8000"
    depends_on:
      ugc-db:
        condition: service_healthy
      ugc-migrations:
        condition: service_completed_successfully
      # Redis нужен только для чтения денилиста отозванных токенов — его ведёт
      # Auth, и читать его надо там же, где он пишется.
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; r=u.Request('http://127.0.0.1:8000/health/live', headers={'X-Request-Id': 'healthcheck'}); sys.exit(0 if u.urlopen(r, timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - movies_net

networks:
  movies_net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  redis_ugc_data:
  esdata:
  etl_state:
  static_volume:
  auth_pg_data:
  ugc_pg_data:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data:
  ch_01_data:
  ch_02_data:
  ch_03_data:
  ch_04_data:
  ch_keeper_01_data:
  ch_keeper_02_data:
  ch_keeper_03_data:
  prometheus_data:
  grafana_data:
  glitchtip_pg_data:
  glitchtip_uploads:
  es_logs_data:
  logstash_data:
  kibana_data:
  filebeat_data:
