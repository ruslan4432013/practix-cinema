groups:
  - name: ugc-etl
    rules:
      # Ровно требование задания «приложение не должно течь».
      # Производная RSS за час, устойчиво положительная три часа подряд, —
      # это уже не всплеск нагрузки, а монотонный рост. Порог по абсолютному
      # значению RSS здесь не годится: он зависит от объёма трафика, а
      # утечка — это форма кривой, а не её высота.
      - alert: EtlMemoryGrowth
        expr: deriv(process_resident_memory_bytes{job="etl-clickhouse"}[1h]) > 0
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "RSS ETL растёт монотонно третий час — вероятная утечка"
          description: "Перезапустить с ETL_TRACEMALLOC_ENABLED=True и смотреть топ-10 приростов в логах."

      # Тот же вопрос с другой стороны: число живых блоков CPython не зависит
      # от поведения аллокатора и растёт только когда объекты реально не
      # освобождаются.
      - alert: EtlAllocatedBlocksGrowth
        expr: deriv(etl_ch_allocated_blocks[1h]) > 0
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "Число живых объектов CPython в ETL растёт монотонно"

      - alert: EtlClickHouseDown
        expr: etl_ch_clickhouse_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ETL не может писать в ClickHouse"
          description: "Данные копятся в Kafka (backpressure), потери нет, но лаг растёт."

      - alert: EtlKafkaDown
        expr: etl_ch_kafka_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ETL не может читать из Kafka"

      # Лаг сам по себе не авария — он растёт и при штатной паузе на время
      # недоступности хранилища. Аварией его делает устойчивый рост.
      - alert: EtlLagGrowing
        expr: etl_ch_consumer_lag_total > 100000 and deriv(etl_ch_consumer_lag_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ETL не успевает за потоком: лаг растёт"

      # Карантин обязан быть пустым. Любое попадание туда — расхождение
      # контракта между коллектором и ETL, и разбирать его надо сразу.
      - alert: EtlInvalidMessages
        expr: increase(etl_ch_messages_invalid_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Сообщения попадают в ugc.invalid_events"

      # «Всё зелёное, а данные не идут» — сценарий, который не ловит ни один
      # алерт выше: зависимости живы, лаг может быть нулевым (например, поток
      # иссяк из-за поломки НА СТОРОНЕ коллектора), а вставок нет.
      # Условие по лагу обязательно: без него правило срабатывало бы каждую
      # ночь на любом стенде, где трафика просто нет.
      - alert: EtlNoDataFlowing
        expr: time() - etl_ch_last_flush_timestamp > 600 and etl_ch_consumer_lag_total > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ETL не вставлял данные больше 10 минут при ненулевом лаге"
          description: "Сообщения в Kafka есть, но в ClickHouse ничего не уезжает — смотреть логи ETL."

  # --- Analytics Collector -------------------------------------------------
  # Ingest-ручка не возвращает 5xx по построению, поэтому «сервис жив» здесь
  # ничего не значит: деградация видна только по метрикам.
  - name: ugc-collector
    rules:
      # Метрика коллектора: событие не доехало ни в Kafka, ни в буфер.
      # Единственная метрика системы, ненулевое значение которой означает
      # безвозвратную потерю данных.
      - alert: UgcEventsDropped
        expr: increase(ugc_events_dropped_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Коллектор теряет события"
          description: "Недоступны и Kafka, и Redis-буфер. Данные потеряны безвозвратно."

      # Ноль воркеров с подключённым продюсером = приём идёт целиком в буфер.
      # Промежуточное значение — частичная деградация: часть воркеров работает
      # штатно, часть пишет в буфер (метрика собирается в режиме livesum).
      - alert: UgcBrokerDisconnected
        expr: ugc_broker_connected_workers == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ни один воркер коллектора не подключён к Kafka"

      - alert: UgcBrokerPartiallyDisconnected
        expr: ugc_broker_connected_workers > 0 and ugc_broker_connected_workers < 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Часть воркеров коллектора потеряла продюсер Kafka"
          description: "Порог 4 = число воркеров uvicorn (см. CMD в analytics_collector/Dockerfile)."

      # Буфер сам по себе не авария — он для того и сделан. Аварией его делает
      # МОНОТОННЫЙ рост: значит дренаж не справляется, и рано или поздно буфер
      # упрётся в UGC_FALLBACK_MAX_SIZE, после чего события начнут теряться.
      - alert: UgcFallbackBufferGrowing
        expr: deriv(ugc_fallback_buffer_size[15m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Буфер деградации коллектора растёт монотонно полчаса"
          description: "Дренаж не успевает. При достижении UGC_FALLBACK_MAX_SIZE события начнут теряться."

      # DLQ обязан быть пустым: попадание туда означает, что запись не удалось
      # доставить за UGC_FALLBACK_MAX_ATTEMPTS попыток.
      - alert: UgcDeadLettered
        expr: increase(ugc_fallback_dead_lettered_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Записи коллектора уходят в DLQ"

      # Доля отброшенных ботов сама по себе нормальна, но резкий скачок — это
      # либо начавшийся обход краулером, либо сломанный разбор User-Agent.
      - alert: UgcBotTrafficSpike
        expr: |
          sum(rate(ugc_events_filtered_total{reason="bot"}[15m]))
            > 0.5 * sum(rate(ugc_events_received_total[15m]))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Больше половины входящих событий отсеивается как трафик ботов"

  - name: recommendations
    rules:
      # F0.4 и SLO раздела 5.1: модель не старше 24 часов, алерт при 36.
      # Запас между целью и алертом — на один повтор упавшего ночного прогона:
      # алерт ровно на 24 часах срабатывал бы каждую ночь, когда батч чуть
      # задержался, и его перестали бы читать.
      - alert: RecsShelfStale
        expr: recs_shelf_age_seconds > 129600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Витрина рекомендаций старше 36 часов"
          description: "Обучение не состоялось минимум дважды подряд. Выдача жива, но показывает позавчерашнее."

      # Витрины нет вовсе: либо первый запуск, либо все прогоны падали.
      # Отдельно от предыдущего, потому что возраст в этом случае не определён
      # и по нему алерт не сработал бы никогда.
      - alert: RecsShelfMissing
        expr: absent(recs_shelf_version) or recs_shelf_version == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Витрина рекомендаций пуста"
          description: "Выдача отвечает 200 с популярным (F1.3), но персонализации и похожих нет."

      # Покрытие каталога ниже SLO: половина каталога уходит в популярное, и
      # фича перестаёт быть фичей (раздел 5.1 ТЗ).
      - alert: RecsCatalogCoverageLow
        expr: recs_catalog_coverage < 0.6
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Похожие есть меньше чем у 60% каталога"
          description: "Проверить объём взаимодействий: скорее всего данных стало меньше, а не модель испортилась."

      # ДЕГРАДАЦИЯ ВИДНА ТОЛЬКО В МЕТРИКАХ. Инвариант раздела 5.2 в том, что
      # отказ источника не превращается в 5xx: пользователь получает 200 с
      # популярным, страница фильма цела, и по кодам ответов авария неотличима
      # от здоровья. Ровно поэтому счётчики ниже — единственный способ узнать,
      # что витрина или кэш легли, и алерт на них не роскошь.
      #
      # Отдельного алерта на долю 5xx здесь НЕТ намеренно: сервис не считает
      # ответы по кодам, а придумывать метрику, которой он не экспортирует,
      # значит завести правило, которое никогда не сработает и будет выглядеть
      # исправным. Долю 5xx на этом маршруте видно в access-логе nginx.
      - alert: RecsShelfUnavailable
        expr: rate(recs_shelf_unavailable_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Витрина рекомендаций недоступна"
          description: "Выдача отвечает популярным из памяти процесса. Пользователь ошибки не видит — проверить recs-db."

      - alert: RecsCacheUnavailable
        expr: rate(recs_cache_unavailable_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Горячий слой рекомендаций недоступен"
          description: "Чтение ушло в PostgreSQL: ответы медленнее, SLO p95 < 200 мс под угрозой. Проверить redis-recs."

      # Батч падает. Витрина при этом живёт вчерашняя, поэтому severity не
      # critical: пользователь ничего не замечает, но чинить надо.
      - alert: RecsTrainingFailing
        expr: increase(recs_train_runs_total{outcome="failure"}[6h]) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Обучение рекомендаций падает"
          description: "Три и более неудачных прогона за шесть часов. Дальше сработает RecsShelfStale."

      # ПРОГОН УСПЕШЕН, А ГОРЯЧИЙ СЛОЙ ПУСТ. Прогрев идёт после коммита витрины
      # и падать ему нельзя: версия уже опубликована, выдача отвечает
      # правильными данными, просто из PostgreSQL. Поэтому такой прогон
      # считается успешным везде — и в recs_train_runs_total, и в возрасте
      # витрины, и в покрытии каталога, — а единственным следом остаётся строка
      # WARMUP FAILED в логе. Это ровно тот класс отказа, против которого
      # написан F0.4: по всем наблюдаемым признакам всё хорошо.
      #
      # Окно 48 часов, а не 6, потому что прогон один в сутки: «три за шесть
      # часов» соседнего правила здесь было бы условием, которое не может
      # выполниться никогда. Две неудачи в этом окне — это две подряд, то есть
      # ровно то, что отличает инцидент от единичной осечки: один непрогретый
      # прогон стоит суток более медленных ответов, а не ошибок.
      #
      # ПЕРВЫМ ДЕЛОМ СМОТРЕТЬ recs_shelf_warm. Счётчик считает решение прогрева
      # о себе самом, и оно бывает ложноотрицательным: если ответ на EXEC
      # потерялся по дороге, данные легли, а warm() вернул False. Гейдж читает
      # указатель из самого Redis и в этом случае покажет 1 — тогда чинить
      # нечего, кроме связности. Он же единственный видит холодный слой без
      # единой неудачи (Redis перезапустили, ключи вычистили руками), но
      # собственного правила у него нет намеренно: он держится нулём с первой
      # же осечки и до следующего прогона, то есть алерт на него звал бы на
      # каждую единичную неудачу.
      - alert: RecsWarmupFailing
        expr: increase(recs_warmup_failures_total[48h]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Горячий слой рекомендаций не прогревается"
          description: "Два прогона подряд закончились непрогретым кэшем: витрина свежая, но каждый запрос идёт в PostgreSQL. Проверить recs_shelf_warm и доступность redis-recs из recsys-trainer."

      # Батч заметно замедлился. SLO раздела 5.1 — прогон меньше двух часов, но
      # порог здесь взят НЕ от него, а от замера: 36,1 с полного прохода на
      # 48 630 зрителях и 494 661 взаимодействии (docs/recommendations.md,
      # «Замеры SLO»). Десять минут — это шестнадцатикратная деградация против
      # замеренного и всё ещё одна двенадцатая ночного окна, то есть запас,
      # который просили в комментарии, есть, а правило при этом срабатывает,
      # пока чинить ещё не поздно.
      #
      # Граница окна тем самым прикрыта тем же правилом: прогон не может съесть
      # половину ночи, не перейдя сначала десять минут, — отдельное правило на
      # 3600 с было бы вторым алертом о том же инциденте, только позже. Порог
      # от SLO как раз и означал «сработает после деградации на два порядка»,
      # то есть уже после RecsShelfStale.
      #
      # Что это число обесценивает — рост КАТАЛОГА, а не аудитории:
      # со-встречаемость квадратична по каталогу, и на стенде его около тысячи
      # фильмов (граница применимости — раздел 6 ТЗ, ~10 000). Каталог в
      # несколько тысяч сдвигает НОРМАЛЬНУЮ длительность сам по себе, и тогда
      # порог надо двигать вместе с ним и переснять замер — иначе правило
      # начнут глушить. Число зрителей так не работает: десятикратный рост
      # аудитории в замере стоил примерно восемнадцатикратной длительности,
      # и запас в шестнадцать раз тут не про него.
      #
      # Соседние правила эту дыру не закрывают, и это не дублирование:
      # RecsTrainingFailing считает прогоны с outcome="failure", а замедлившийся
      # батч НЕ падает — он честно завершается, просто позже; RecsShelfStale
      # сработает, но только когда витрине станет 36 часов, то есть на сутки
      # позже, чем проблема стала видна в метрике.
      #
      # Среднее по _sum/_count, а НЕ histogram_quantile: прогон один в сутки, и
      # квантиль по девяти корзинам с одним наблюдением вернёт границу корзины,
      # а не длительность. Среднее здесь честное: наблюдение пишется для любого
      # исхода, а «слот уже отработан» (skipped) выясняется после всех расчётов
      # и потому длится столько же, сколько обычный прогон. Занизить среднее
      # может только рано упавший прогон — за ним следит правило выше.
      #
      # Гистограмму наполняет только цикл `main.py`: ручной `cli train` в неё не
      # пишет, и его прогон правилу не виден.
      - alert: RecsTrainingSlow
        expr: |
          increase(recs_train_duration_seconds_sum[24h])
            / increase(recs_train_duration_seconds_count[24h]) > 600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Прогон обучения рекомендаций занимает больше десяти минут"
          description: "Замеренная норма — 36 с, сейчас прогон в шестнадцать с лишним раз дольше. Витрина ещё свежая и пользователь ничего не замечает, но до половины двухчасового окна SLO остался порядок величины — смотреть объём каталога, объём датасета и время ALS."
