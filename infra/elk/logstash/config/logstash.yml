# Настройки САМОГО Logstash. Пайплайн — что читать, как разбирать, куда писать
# — живёт отдельно, в pipeline/logs.conf.
node.name: practix-logstash

# ECS выключен НАМЕРЕННО. При pipeline.ecs_compatibility: v8 фильтры начинают
# раскладывать поля по схеме Elastic Common Schema ([host][name], [url][path],
# [log][level]), и наш формат — timestamp/level/logger/message/request_id/
# service — оказался бы наполовину переименован. Формат задают
# practix_core.logging и nginx.conf, а не умолчания плагинов: иначе одно и то
# же поле называется по-разному в коде и в Kibana.
pipeline.ecs_compatibility: disabled

# Очередь на диске, а не в памяти. Beats-протокол подтверждает батч, КАК ТОЛЬКО
# он попал в очередь: с очередью в памяти Filebeat считает пачку доставленной,
# удаляет её из своей очереди, а перезапуск Logstash её теряет — и потерю
# нечем обнаружить, потому что обе стороны отработали штатно.
queue.type: persisted
queue.max_bytes: 512mb

# DLQ — единственное место, куда попадают события, ОТВЕРГНУТЫЕ Elasticsearch.
# Главная причина отказа здесь неизбежна по устройству: поля из extra=... идут
# в корень документа, и первый сервис, залогировавший `status` строкой после
# того, как nginx закрепил его целым числом, получает отказ ВСЕГО документа.
# Без DLQ такие записи пропадают молча, и «в Kibana нет логов сервиса X»
# превращается в неразрешимую загадку.
dead_letter_queue.enable: true
dead_letter_queue.max_bytes: 256mb

# API на всех интерфейсах: healthcheck ходит на 127.0.0.1 и без этого, но при
# отладке удобно постучаться в 9600 с хоста и посмотреть _node/stats.
api.http.host: 0.0.0.0

log.level: info
