# ЕДИНСТВЕННЫЙ файл пайплайна, и это не лень. Logstash СКЛЕИВАЕТ все файлы из
# pipeline/ в ОДИН пайплайн в лексикографическом порядке: разложив input/filter/
# output по трём файлам, получаешь ровно ту же конфигурацию, но с иллюзией, что
# они независимы, — а условие, написанное в «filter.conf», продолжает
# действовать на всё, что придёт из любого input.

input {
  # Beats-протокол, а не gelf или tcp: Filebeat подтверждает доставку батча и
  # переотправляет его после отказа Logstash. Драйвер gelf шлёт по UDP без
  # подтверждения — перезапуск Logstash теряет логи молча; вдобавок при
  # не-json-file драйвере перестаёт работать `docker compose logs`.
  beats {
    port => 5044
  }
}

filter {
  # --- 1. Наш JSON, и ТОЛЬКО наш -------------------------------------------
  # И Python-сервисы (practix_core.logging.JsonFormatter), и nginx (log_format
  # json_access) пишут ОДНУ строку JSON, у которой ПЕРВЫЙ ключ — timestamp.
  # Порядок ключей закреплён тестом
  # libs/platform-core/tests/test_logging.py::test_service_field_follows_request_id_in_key_order,
  # поэтому здесь он работает как признак «строка наша».
  #
  # ПОЧЕМУ НЕ ПРОСТО «начинается с {». Filebeat приносит логи ВСЕХ контейнеров
  # стенда, и половина инфраструктуры тоже пишет JSON — но свой. У
  # Elasticsearch и Jaeger `service` — ОБЪЕКТ (ECS: service.name), у нас
  # строка; у Jaeger `status` — строка («IDLE»), у nginx — число. Elasticsearch
  # закрепляет тип поля за тем, кто записал первым, и все последующие документы
  # с другим типом отвергает ЦЕЛИКОМ. Проверено на живом стенде: разбор всего,
  # что похоже на JSON, за три минуты положил в DLQ 500 КБ событий и сломал
  # диапазонные запросы по status.
  #
  # Строки чужих образов остаются как есть — целиком в message. Они ищутся
  # полнотекстово и по имени контейнера; раскладывать их на поля нам не нужно,
  # а цена такой раскладки — общий индекс, отвергающий наши собственные логи.
  if [message] =~ /^\{"timestamp":/ {
    json {
      source => "message"
      # Поля кладутся В КОРЕНЬ, а не в target: level, service, request_id
      # обязаны называться в Kibana ровно так же, как в коде — иначе запрос из
      # инцидента приходится переводить с одного языка на другой.
      skip_on_invalid_json => true
      tag_on_failure => ["_jsonparsefailure"]
    }
  }

  # --- 2. Время события ----------------------------------------------------
  # @timestamp, пришедший от Filebeat, — это момент ЗАХВАТА строки docker'ом.
  # Прикладное время отличается от него на задержку буферов, и сортировать
  # инцидент надо по прикладному. Момент захвата при этом сохраняется: разница
  # между ними и есть лаг доставки, по которому видно, что конвейер отстаёт.
  if [timestamp] {
    mutate { copy => { "@timestamp" => "shipped_at" } }
    date {
      # Python: '%Y-%m-%dT%H:%M:%S%z' -> 2026-07-30T18:49:34+0000 (БЕЗ мс).
      # Nginx $time_iso8601           -> 2026-07-30T18:49:34+00:00.
      match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ssZ"]
      target => "@timestamp"
      remove_field => ["timestamp"]
      tag_on_failure => ["_dateparsefailure"]
    }
  }

  # --- 3. Кто это написал --------------------------------------------------
  # Прикладные записи подписываются САМИ (static_fields={'service': ...}) — это
  # единственный способ, переживающий смену способа доставки логов и
  # переименование контейнера. Для чужих образов источником имени остаётся имя
  # контейнера: в этом стенде container_name всегда равен имени сервиса compose.
  if ![service] and [container][name] {
    mutate { copy => { "[container][name]" => "service" } }
  }
  if ![level] {
    mutate { add_field => { "level" => "INFO" } }
  }
  # Строка в stderr от сервиса, у которого нет нашего формата, — это как
  # минимум предупреждение: иначе паника postgres лежала бы в Kibana как INFO
  # и не попадала бы ни в один фильтр по уровню.
  if [stream] == "stderr" and ![logger] {
    mutate { replace => { "level" => "WARNING" } }
  }

  # --- 4. Nginx: числа должны быть числами ----------------------------------
  # В log_format status и тайминги ЗАКАВЫЧЕНЫ намеренно (см. nginx.conf):
  # $status при обрыве соединения равен 000, а 000 — невалидный литерал JSON
  # (ведущие нули), и весь access-лог уехал бы в _jsonparsefailure.
  # $upstream_*_time вдобавок бывает пустым и списком «0.001, 0.002».
  # Приведение типов делается здесь, чтобы в Kibana работали диапазоны
  # (status >= 500) и агрегаты (перцентили request_time).
  if [service] == "nginx" {
    mutate {
      convert => {
        "status"          => "integer"
        "body_bytes_sent" => "integer"
        "request_length"  => "integer"
        "request_time"    => "float"
      }
    }
  }

  # @version — служебное поле Logstash, в Kibana оно только занимает место в
  # списке полей.
  mutate { remove_field => ["@version"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch-logs:9200"]
    # data_stream ОБЯЗАН быть выключен ЯВНО. По умолчанию плагин стоит в режиме
    # `auto` и на Elasticsearch 8+/9+ сам переключается на data streams, после
    # чего собственное имя индекса ИГНОРИРУЕТСЯ, а логи уезжают в
    # .ds-logs-generic-default-*. Индекс по дате нужен, чтобы «удалить старое»
    # означало «удалить индекс», а не запрос на удаление документов.
    data_stream => false
    index => "practix-logs-%{+YYYY.MM.dd}"
    # Плагин не должен ставить свой legacy-шаблон logstash-*: он всё равно не
    # совпадает с нашим паттерном индексов. Типы полей закрепляет собственный
    # index template — см. infra/elk/README.md.
    manage_template => false
  }
}
