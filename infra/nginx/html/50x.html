<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сервис временно недоступен — Practix Cinema</title>
  <!-- Стили внутри файла, картинок и шрифтов нет намеренно: страница
       показывается ровно тогда, когда сайт не отвечает, и подтягивать с него
       ассеты означало бы показать её сломанной. -->
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
           min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #14161a; color: #e8eaed; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 1rem; color: #e8eaed; }
    p { line-height: 1.6; color: #b6bac1; }
    a { display: inline-block; margin-top: 1.5rem; padding: .7rem 1.4rem; border-radius: .5rem;
        background: #3b82f6; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <!-- Кода ошибки на странице НЕТ намеренно: один файл обслуживает 500, 502,
         503 и 504, и напечатанное здесь число было бы верным в трёх случаях из
         четырёх. Точный код всё равно приходит в статусе ответа. -->
    <h1>Сервис временно недоступен</h1>
    <p>
      Это не ошибка адреса: страница существует, но сейчас её некому отдать.
      Обновите страницу через минуту — скорее всего, всё уже заработает.
    </p>
    <a href="/">На главную</a>
  </main>
</body>
</html>
