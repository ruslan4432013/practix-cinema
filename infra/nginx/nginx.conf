worker_processes  auto;


events {
    worker_connections  10240;
}


http {
    include       mime.types;

    # --- Access-лог в JSON ---------------------------------------------------
    # Строки читает Filebeat и разбирает Logstash. Разбирать их grok'ом означало
    # бы держать копию формата в двух местах: при добавлении поля регулярное
    # выражение молча перестало бы совпадать, а лог продолжил бы выглядеть
    # исправным.
    #
    # escape=json ОБЯЗАТЕЛЕН. Без него кавычка или обратный слэш в User-Agent,
    # Referer или URL ломает JSON, и запись уезжает в _jsonparsefailure — а
    # ровно этими полями управляет клиент, то есть сломать лог можно намеренно.
    #
    # ЧИСЛА ЗАКАВЫЧЕНЫ намеренно: $status при обрыве соединения равен 000, а 000
    # — невалидный литерал JSON (ведущие нули); $upstream_response_time бывает
    # пустым и списком «0.001, 0.002». Типы приводит Logstash, см.
    # infra/elk/logstash/pipeline/logs.conf.
    #
    # Имена ключей — те же, что у Python-сервисов (timestamp/level/logger/
    # message/service/request_id): один индекс, один набор полей, и запрос
    # `request_id: "..."` находит И строку nginx, И строки приложений.
    log_format  json_access  escape=json
        '{'
          '"timestamp":"$time_iso8601",'
          '"level":"INFO",'
          '"logger":"nginx.access",'
          '"service":"nginx",'
          '"message":"$request",'
          '"request_id":"$request_id",'
          '"remote_addr":"$remote_addr",'
          '"remote_user":"$remote_user",'
          '"method":"$request_method",'
          '"uri":"$uri",'
          '"args":"$args",'
          '"status":"$status",'
          '"body_bytes_sent":"$body_bytes_sent",'
          '"request_length":"$request_length",'
          '"request_time":"$request_time",'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_status":"$upstream_status",'
          '"upstream_response_time":"$upstream_response_time",'
          '"upstream_connect_time":"$upstream_connect_time",'
          '"http_referer":"$http_referer",'
          '"http_user_agent":"$http_user_agent",'
          '"http_x_forwarded_for":"$http_x_forwarded_for",'
          '"scheme":"$scheme",'
          '"protocol":"$server_protocol"'
        '}';

    access_log /dev/stdout json_access;

    server_tokens   off;

    sendfile        on;
    tcp_nodelay     on;
    tcp_nopush      on;

    client_max_body_size 200m;

    # Тайм-ауты чтения тела и отправки ответа. Без них медленное соединение
    # держит воркер сколь угодно долго — это и есть slowloris: атака не объёмом
    # трафика, а числом «почти живых» соединений.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    gzip on;
    gzip_comp_level 3;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/json
        application/x-javascript
        text/xml
        text/javascript;

    # Разжатие ЗАПРОСОВ от клиента. Ответы ingest-ручки — десятки байт, сжимать
    # там нечего; полезно обратное: пачка из 50 событий сжимается в разы, и
    # трекеру выгодно слать её с Content-Encoding: gzip. Апстрим при этом
    # получает обычный несжатый JSON и ничего про сжатие не знает.
    gunzip on;

    keepalive_timeout  65;
    keepalive_requests 1000;

    # --- CORS -----------------------------------------------------------
    # Разрешённый источник для preflight-ответов ingest-ручки (см. site.conf).
    # Именно map, а не «*»: значение возвращается в Access-Control-Allow-Origin,
    # и подставлять туда произвольный присланный Origin означало бы разрешить
    # всех. Неизвестный источник получает пустую строку — заголовок не
    # добавляется, и браузер запрос не пропускает.
    #
    # СПИСОК ОБЯЗАН СОВПАДАТЬ с UGC_CORS_ALLOW_ORIGINS в .env: иначе запрос,
    # прошедший preflight на Nginx, будет отбит самим приложением.
    map $http_origin $cors_origin {
        default                  '';
        'http://localhost'       $http_origin;
        'http://127.0.0.1'       $http_origin;
    }

    # Встроенный DNS Docker. Нужен для формы `proxy_pass http://$переменная`
    # (см. комментарий про масштабирование ниже).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # МАСШТАБИРОВАНИЕ. Имя сервиса в `server` резолвится ОДИН РАЗ при старте
    # Nginx, поэтому `docker compose up --scale analytics-collector=3` сам по
    # себе ничего не даёт: трафик продолжит идти в адрес, зафиксированный при
    # старте. Параметр `server ... resolve` решает это только в NGINX Plus.
    #
    # В open source вариантов два, и оба с ценой:
    #   1) перечислить реплики явными строками `server` — работает, но требует
    #      стабильных имён и правки конфига при изменении их числа;
    #   2) `set $upstream analytics-collector:8000; proxy_pass http://$upstream;`
    #      — резолвит на каждый запрос и подхватывает реплики автоматически, но
    #      обходит блок upstream, а значит теряет keepalive к апстриму. Для
    #      ingest-ручки это дорого: новое TCP-соединение на событие съедает
    #      больше, чем даёт балансировка.
    # Поэтому здесь оставлена статическая форма с keepalive, а масштабирование
    # делается пунктом 1 — осознанно, а не по недосмотру.
    upstream api_upstream {
        server api:8000;
        keepalive 512;
    }

    upstream auth_upstream {
        server auth:8000;
        keepalive 512;
    }

    upstream django_upstream {
        server django-admin:8000;
        keepalive 64;
    }

    upstream analytics_upstream {
        server analytics-collector:8000;
        keepalive 512;
    }

    upstream ugc_upstream {
        server ugc-api:8000;
        keepalive 512;
    }

    upstream shortener_upstream {
        server link-shortener:8000;
        keepalive 512;
    }

    upstream recommendations_upstream {
        server recommendations-api:8000;
        keepalive 512;
    }

    # --- Ограничения частоты -------------------------------------------------
    # Первый рубеж защиты — до приложения. Лимиты здесь заведомо выше
    # прикладных (см. RATE_LIMIT_* и UGC_RATE_LIMIT_* в .env): Nginx отсекает
    # грубый флуд, не тратя воркер Python, а точный учёт (в том числе вес пачки
    # событий) ведёт сам сервис.
    limit_req_zone $binary_remote_addr zone=ugc_ingest:16m rate=50r/s;

    # Отдельная зона на порядок строже: /login, /register и /refresh — цели
    # брутфорса, и прикладной лимит там срабатывает уже ПОСЛЕ того, как запрос
    # дошёл до Python и до Redis, то есть каждая попытка подбора всё равно
    # стоит воркера. Проверка пароля идёт через argon2 — намеренно дорогую
    # функцию, поэтому цена одной попытки здесь максимальная в системе.
    limit_req_zone $binary_remote_addr zone=auth_login:8m rate=1r/s;

    # Записи UGC — единственный лимит, у которого НЕТ прикладного дубля: сервис
    # ugc-api намеренно не содержит собственного лимитера. В репозитории уже два
    # разошедшихся (фиксированное окно в Auth, скользящее в коллекторе), и третья
    # копия дала бы только дублирование. Порог ниже, чем у ugc_ingest, потому что
    # эти запросы дороже: каждый берёт блокировку и пишет в PostgreSQL, тогда как
    # событие аналитики уходит в буфер продюсера.
    #
    # Зона ОТДЕЛЬНАЯ от ugc_ingest: общая считалась бы по IP независимо от
    # маршрута, и всплеск трафика одного сервиса отдавал бы 429 другому.
    limit_req_zone $binary_remote_addr zone=ugc_write:16m rate=20r/s;

    # Рекомендации. Раздел 5.5 ТЗ требует ограничивать анонимные ручки частотой
    # на nginx, и прикладного дубля у этого лимита нет — как и у ugc_write.
    #
    # Порог выше, чем у записей UGC, и ниже, чем у ingest: запрос выдачи — это
    # чтение готового списка из Redis, то есть дёшево, но блок рисуется на
    # каждой странице фильма, и пик здесь совпадает с пиком просмотра каталога.
    # Плановые 100 RPS на весь сервис против 50 r/s на адрес — запас, за
    # которым остаётся только перебор.
    limit_req_zone $binary_remote_addr zone=recs_read:16m rate=50r/s;

    # limit_req ограничивает ЧАСТОТУ запросов, но не число одновременных
    # соединений, поэтому медленные соединения им не отсекаются.
    limit_conn_zone $binary_remote_addr zone=perip:16m;
    limit_conn perip 100;
    limit_conn_status 429;

    proxy_redirect     off;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   Connection       "";
    # Nginx — источник идентификатора запроса: $request_id перезаписывает любой
    # присланный клиентом X-Request-Id (защита от подмены), заголовок наследуется
    # всеми location-блоками из conf.d.
    proxy_set_header   X-Request-Id     $request_id;
    proxy_http_version 1.1;

    # --- Доверенные прокси ---------------------------------------------------
    # X-Forwarded-For принимается только от перечисленных сетей. Ошибка здесь
    # имеет конкретное и неочевидное последствие: если реальный прокси не попал
    # в список, $remote_addr остаётся его адресом, ВСЕ клиенты выглядят одним
    # адресом, и limit_req считает их одним клиентом — лимит либо срабатывает
    # ложно сразу на всех, либо не срабатывает вовсе.
    #
    # Перечислены диапазоны Docker по умолчанию (bridge-сети compose берут
    # адреса из 172.16.0.0/12) и приватные сети RFC1918. За облачным
    # балансировщиком сюда нужно добавить ЕГО диапазоны — и только их.
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  127.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    # Берём первый адрес слева, не попавший в доверенные сети, а не просто
    # первый в списке: без этого клиент подделал бы заголовок и подменил свой
    # адрес в счётчиках лимита.
    real_ip_recursive on;

    include conf.d/*.conf;
}
