# МАРШРУТИЗАЦИЯ. Раньше блоки различались только порядком объявления:
# `location /api` — префиксный перехватчик ВСЕГО /api, а маршруты Auth и
# Analytics Collector работали лишь потому, что стояли выше него (регулярные
# выражения проверяются в порядке объявления и выигрывают у префикса).
# Достаточно было переставить блоки местами — и события поехали бы в Movies API
# с ответом 404, причём конфиг остался бы валидным, а сервисы живыми.
#
# Здесь зависимость от порядка убрана: у специфичных маршрутов стоит `^~`,
# который в Nginx имеет приоритет НАД регулярными выражениями и над более
# короткими префиксами независимо от места в файле. Порядок блоков ниже —
# для чтения человеком, а не для работы Nginx.
server {
    listen      80      default_server;
    listen      [::]:80 default_server;
    server_name _;

    root /data;

    location /static/ {
        alias /data/static/;
        log_not_found off;
        expires 90d;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|css|js)$ {
        log_not_found off;
        expires       90d;
    }

    location /admin {
        proxy_pass http://django_upstream;
    }

    # --- Auth ---------------------------------------------------------------
    # Ручки входа вынесены в отдельные блоки с жёстким сетевым лимитом: без него
    # брутфорс пароля доходил до Python и до Redis, тратя воркер на каждую
    # попытку, а проверка пароля идёт через argon2 — намеренно дорогую функцию,
    # то есть цена одной попытки здесь максимальная в системе.
    # burst=5 оставляет запас на честные опечатки, nodelay отдаёт эти попытки
    # сразу, а не размазывает их по секунде.
    location ^~ /api/v1/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://auth_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location ^~ /api/v1/auth/register {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://auth_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location ^~ /api/v1/auth/refresh {
        limit_req zone=auth_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://auth_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location ^~ /api/v1/auth {
        proxy_pass http://auth_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location ^~ /api/v1/roles {
        proxy_pass http://auth_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location ^~ /api/v1/users {
        proxy_pass http://auth_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # --- Analytics Collector ------------------------------------------------
    # Два префикса вместо одного регулярного выражения: ingest (/api/v1/events)
    # и документация (/api/analytics/openapi). Путь документации отличается от
    # /api/openapi, который уже занят Movies API.
    location ^~ /api/v1/events {
        # Preflight отвечается прямо здесь. Иначе каждый cross-origin POST
        # трекера стоил бы двух запросов, второй из которых тратит воркер
        # Python на полностью статичный ответ.
        #
        # Источник берётся из map $cors_origin в nginx.conf, и его список
        # обязан совпадать с UGC_CORS_ALLOW_ORIGINS приложения — иначе
        # получится два источника правды и запрос, прошедший preflight, будет
        # отбит самим сервисом.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods 'POST, GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Request-Id' always;
            # Сутки: разрешение кэшируется браузером, и preflight перестаёт
            # приходить на каждый POST.
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        limit_req zone=ugc_ingest burst=100 nodelay;
        # Отказ по лимиту — не ошибка сервера: отдаём 429, а не 503.
        limit_req_status 429;

        proxy_pass http://analytics_upstream;
        # Таймауты короче, чем у остальных маршрутов: приём события —
        # операция на единицы миллисекунд, и подвисший запрос от браузера
        # быстрее оборвать, чем держать соединение.
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    location ^~ /api/analytics {
        proxy_pass http://analytics_upstream;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    # --- UGC API (оценки, закладки, рецензии) -------------------------------
    # `^~` обязателен, и обязателен по той же причине, что у блоков выше: без
    # него эти пути соперничают с `location /api` только длиной префикса, а
    # первый же подходящий regex-блок победил бы их независимо от неё.
    #
    # Отдельный префикс /api/v1/ratings, а НЕ /api/v1/films/{id}/rating: каталог
    # фильмов обслуживает Movies API, и `location ^~ /api/v1/films` увёл бы у
    # него весь /api/v1/films целиком.
    location ^~ /api/v1/likes {
        limit_req zone=ugc_write burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://ugc_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location ^~ /api/v1/bookmarks {
        limit_req zone=ugc_write burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://ugc_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location ^~ /api/v1/reviews {
        limit_req zone=ugc_write burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://ugc_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Чтение рейтинга — самый горячий путь сервиса и одно обращение по
    # первичному ключу. Лимит записи на него не вешаем.
    location ^~ /api/v1/ratings {
        proxy_pass http://ugc_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Документация: /api/openapi занят Movies API, /api/analytics/openapi —
    # коллектором, поэтому третий сервис получает третий префикс.
    location ^~ /api/ugc {
        proxy_pass http://ugc_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # --- Сокращённые ссылки -------------------------------------------------
    # `^~ /s/` — СО СЛЭШЕМ, и это не косметика. Префикс `/s` перехватил бы
    # `/static/` (CSS админки, блок выше), потому что `^~` выигрывает у
    # регулярных выражений и не смотрит, где он объявлен.
    #
    # Обратная сторона того же `^~` — то, ради чего он здесь: без него
    # `location ~* \.(css|js|png)$` увёл бы у нас код вида /s/AbC12.js.
    location ^~ /s/ {
        proxy_pass http://shortener_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Документация: /api/openapi занят Movies API, /api/analytics — коллектором,
    # /api/ugc — сервисом UGC.
    #
    # У `POST /api/v1/links` маршрута НЕТ намеренно: ручка создания ссылок
    # межсервисная, и её недостижимость снаружи должна следовать из построения,
    # а не из списка разрешённых адресов, который однажды поправят не в ту
    # сторону. Запрос к ней извне попадёт в `location /api` и уйдёт в Movies API.
    location ^~ /api/shortener {
        proxy_pass http://shortener_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # --- Movies API ---------------------------------------------------------
    # Префиксный перехватчик всего остального /api. Стоит ниже специфичных
    # блоков только ради читаемости: те объявлены через `^~` и выигрывают у
    # него по правилам Nginx, а не по расположению в файле.
    location /api {
        proxy_pass http://api_upstream;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # --- Служебные пути -----------------------------------------------------
    # /health/* и /metrics приложений раньше попадали под `location /` и
    # уходили в Django, отвечавший на них чем-то невнятным вместо 404.
    # Полагаться на такое неявное поведение маршрутизации не стоит: пробы и
    # метрики снимаются внутри сети напрямую с контейнеров (healthcheck Docker,
    # скрейп Prometheus), а снаружи их быть не должно вовсе.
    location ^~ /health {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://django_upstream;
    }

    error_page 404 /404.html;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }
}
