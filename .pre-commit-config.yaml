# Установка: pip install pre-commit && pre-commit install
# Прогон по всему дереву: pre-commit run --all-files
#
# ruff ЗАПУСКАЕТСЯ ЧЕРЕЗ uv, а не через ruff-pre-commit. Раньше версия ruff была
# пришпилена в ДВУХ местах — `rev` здесь и `version` у ruff-action в CI, — а в
# самом репозитории её не было вовсе, поэтому локальный ruff мог отличаться от
# обоих. Теперь версия живёт в [dependency-groups] dev корневого pyproject.toml,
# и это единственное место.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (линтер)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (форматтер)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # allow-multiple-documents: compose-файлы используют YAML-анкоры
      # (x-clickhouse-server, x-clickhouse-keeper).
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: check-case-conflict
